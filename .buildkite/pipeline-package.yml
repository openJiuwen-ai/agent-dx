steps:
- label: ':package: Build ADX base package'
  key: platform-build
  agents:
    queue: default
    os: linux
    arch: amd64
  concurrency: 1
  concurrency_group: adx/release-amd64
  command: bash .buildkite/step.sh release bash .buildkite/build-e2e.sh
  timeout_in_minutes: 60
  artifact_paths:
  - out/buildkite/logs/**/*
  - out/buildkite/adx-release.tar.gz
  - out/buildkite/adx-release.tar.gz.sha256
  - out/buildkite/backend/**/*
  - out/buildkite/release-manifest.json
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_CARGO_HOME: /mnt/paas/build-cache/adx/cargo-home
    CARGO_HOME: /mnt/paas/build-cache/adx/cargo-home
    CARGO_TARGET_DIR: /mnt/paas/build-cache/adx/cargo-target/amd64-rust1950
    RUSTUP_TOOLCHAIN: stable
    RUSTUP_AUTO_INSTALL: '0'
    GOCACHE: /mnt/paas/build-cache/adx/go-build/amd64
    GOMODCACHE: /mnt/paas/build-cache/adx/go-mod
    ADX_BACKEND_ARTIFACT_BUILD: 01a0ad6d-9629-4da8-903b-3f8bd1ddc992
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/compile-ubuntu2004-rust:v20260826_rust1950_musl_x86_64@sha256:13008c86d6ce56422b4591570d3b358a92d6d384100aafa41e04f5556a5d8faf
          volumeMounts:
          - name: build-cache
            mountPath: /mnt/paas
          resources:
            requests: {cpu: '4', memory: 8Gi}
            limits: {cpu: '8', memory: 16Gi}
        volumes:
        - name: build-cache
          hostPath: {path: /mnt/paas, type: DirectoryOrCreate}
- label: ':cloud: Upload ADX base artifacts to OBS'
  key: platform-obs
  depends_on: platform-build
  if: build.env("ADX_OBS_UPLOAD") == "1"
  agents:
    queue: default
    os: linux
    arch: amd64
  command: bash .buildkite/upload-obs.sh
  timeout_in_minutes: 20
  artifact_paths:
  - out/buildkite/obs/**/*
  - out/buildkite/logs/step-obs.log
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_OBS_BUCKET: openyuanrong
    ADX_OBS_ENDPOINT: obs.cn-southwest-2.myhuaweicloud.com
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/compile-ubuntu2004-rust:v20260826_rust1950_musl_x86_64@sha256:13008c86d6ce56422b4591570d3b358a92d6d384100aafa41e04f5556a5d8faf
          resources:
            requests: {cpu: '1', memory: 2Gi}
            limits: {cpu: '2', memory: 4Gi}
          env:
          - name: OBS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: {name: obs-credentials, key: AK, optional: false}
          - name: OBS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef: {name: obs-credentials, key: SK, optional: false}
