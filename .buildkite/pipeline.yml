steps:
- label: ':package: Build ADX release'
  key: platform-build
  agents:
    queue: default
    os: linux
    arch: amd64
  concurrency: 1
  concurrency_group: adx/release-amd64
  command: bash .buildkite/step.sh release bash .buildkite/build-e2e.sh
  timeout_in_minutes: 60
  artifact_paths:
  - out/buildkite/logs/**/*
  - out/buildkite/adx-release.tar.gz
  - out/buildkite/adx-release.tar.gz.sha256
  - out/buildkite/backend/**/*
  - out/buildkite/release-manifest.json
  - out/buildkite/sdk/*.whl
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_CARGO_HOME: /mnt/paas/build-cache/adx/cargo-home
    CARGO_HOME: /mnt/paas/build-cache/adx/cargo-home
    CARGO_TARGET_DIR: /mnt/paas/build-cache/adx/cargo-target/amd64-rust1950
    RUSTUP_TOOLCHAIN: stable
    RUSTUP_AUTO_INSTALL: '0'
    GOCACHE: /mnt/paas/build-cache/adx/go-build/amd64
    GOMODCACHE: /mnt/paas/build-cache/adx/go-mod
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/compile-ubuntu2004-rust:v20260826_rust1950_musl_x86_64@sha256:13008c86d6ce56422b4591570d3b358a92d6d384100aafa41e04f5556a5d8faf
          volumeMounts:
          - name: build-cache
            mountPath: /mnt/paas
          resources:
            requests:
              cpu: '4'
              memory: 8Gi
            limits:
              cpu: '8'
              memory: 16Gi
        volumes:
        - name: build-cache
          hostPath:
            path: /mnt/paas
            type: DirectoryOrCreate
  if: build.env("ADX_COLLECTOR_SYNC_ONLY") != "1"
- label: ':cloud: Upload ADX artifacts to OBS'
  key: platform-obs
  depends_on: platform-build
  agents:
    queue: default
    os: linux
    arch: amd64
  command: bash .buildkite/upload-obs.sh
  timeout_in_minutes: 20
  artifact_paths:
  - out/buildkite/obs/**/*
  - out/buildkite/logs/step-obs.log
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_OBS_BUCKET: openyuanrong
    ADX_OBS_ENDPOINT: obs.cn-southwest-2.myhuaweicloud.com
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/compile-ubuntu2004-rust:v20260826_rust1950_musl_x86_64@sha256:13008c86d6ce56422b4591570d3b358a92d6d384100aafa41e04f5556a5d8faf
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
          env:
          - name: OBS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: obs-credentials
                key: AK
                optional: false
          - name: OBS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: obs-credentials
                key: SK
                optional: false
  if: build.env("ADX_COLLECTOR_SYNC_ONLY") != "1" && build.env("ADX_OBS_UPLOAD") == "1"
- label: ':docker: Publish ADX images'
  key: platform-images
  depends_on: platform-build
  agents:
    queue: default
    os: linux
    arch: amd64
  command: bash .buildkite/step.sh images python3 .buildkite/with_registry.py --docker
    -- bash .buildkite/package-e2e.sh
  timeout_in_minutes: 40
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_E2E_IMAGE_REPOSITORY: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/adx-e2e
  artifact_paths:
  - out/buildkite/logs/**/*
  - out/buildkite/bundle/*.json
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/sandbox-packager:v20260506_kubectl
          securityContext:
            privileged: true
          volumeMounts:
          - name: docker-graph
            mountPath: /var/lib/docker
          resources:
            requests:
              cpu: '8'
              memory: 16Gi
            limits:
              cpu: '8'
              memory: 16Gi
          env: &id001
          - name: SWR_USERNAME
            valueFrom:
              secretKeyRef:
                name: swr-credentials
                key: username
                optional: true
          - name: SWR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: swr-credentials
                key: password
                optional: true
          - name: SWR_DOCKER_CONFIG_JSON
            valueFrom:
              secretKeyRef:
                name: swr-pull-secret
                key: .dockerconfigjson
                optional: true
        volumes:
        - name: docker-graph
          emptyDir: {}
  if: build.env("ADX_COLLECTOR_SYNC_ONLY") != "1" && build.env("ADX_BASE_ONLY") != "1"
- label: ':kubernetes: Kubernetes E2E (Sandbox SDK)'
  key: platform-e2e
  depends_on: platform-images
  agents:
    queue: default
    os: linux
    arch: amd64
  command: bash .buildkite/step.sh e2e python3 .buildkite/with_registry.py -- bash
    .buildkite/run-e2e.sh
  timeout_in_minutes: 30
  artifact_paths:
  - out/buildkite/acceptance/**/*
  - out/buildkite/logs/**/*
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_KUBECONFIG: /var/run/yr-k8s/target/kubeconfig
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/sandbox-deployer:v20260506_kubectl_py39
          resources:
            requests:
              cpu: '2'
              memory: 4Gi
            limits:
              cpu: '4'
              memory: 8Gi
          env: *id001
  if: build.env("ADX_COLLECTOR_SYNC_ONLY") != "1" && build.env("ADX_BASE_ONLY") != "1"
- label: ':kubernetes: Firecracker checkpoint + snapshots + faults'
  key: platform-fc-e2e
  if: build.env("ADX_COLLECTOR_SYNC_ONLY") != "1" && build.env("ADX_BASE_ONLY") != "1"
    && (build.env("ADX_E2E_CHECKPOINT") == "1")
  depends_on: platform-images
  agents:
    queue: default
    os: linux
    arch: amd64
  command: bash .buildkite/firecracker-step.sh
  timeout_in_minutes: 40
  artifact_paths:
  - out/buildkite/firecracker/**/*
  - out/buildkite/logs/firecracker-kubernetes.log
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_KUBECONFIG: /var/run/yr-k8s/target/kubeconfig
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/sandbox-deployer:v20260506_kubectl_py39
          resources:
            requests:
              cpu: '2'
              memory: 4Gi
            limits:
              cpu: '4'
              memory: 8Gi
          env: *id001
- label: ':docker: Mirror pinned OpenTelemetry Collector to SWR'
  key: collector-sync
  agents:
    queue: default
    os: linux
    arch: amd64
  command: python3 .buildkite/with_registry.py --docker -- bash .buildkite/sync-collector.sh
  timeout_in_minutes: 30
  env:
    BUILDKITE_AGENT_NAME: agent-stack-k8s
    ADX_E2E_IMAGE_REPOSITORY: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/adx-e2e
  artifact_paths:
  - out/buildkite/collector-sync/**/*
  plugins:
  - kubernetes:
      podSpec:
        imagePullSecrets:
        - name: swr-pull-secret
        containers:
        - image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/sandbox-packager:v20260506_kubectl
          securityContext:
            privileged: true
          volumeMounts:
          - name: docker-graph
            mountPath: /var/lib/docker
          resources:
            requests:
              cpu: '8'
              memory: 16Gi
            limits:
              cpu: '8'
              memory: 16Gi
          env:
          - name: SWR_USERNAME
            valueFrom:
              secretKeyRef:
                name: swr-credentials
                key: username
                optional: true
          - name: SWR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: swr-credentials
                key: password
                optional: true
          - name: SWR_DOCKER_CONFIG_JSON
            valueFrom:
              secretKeyRef:
                name: swr-pull-secret
                key: .dockerconfigjson
                optional: true
        volumes:
        - name: docker-graph
          emptyDir: {}
  if: build.env("ADX_COLLECTOR_SYNC_ONLY") == "1"
