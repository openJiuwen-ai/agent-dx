[workspace]
resolver = "2"
members = [
    "agent/crates/core",
    "agent/crates/store",
    "agent/dispatcher",
    "agent/api",
    "platform/control-plane/api-server",
    "gateway",
    "platform/runtime/rrt",
    "platform/crates/core",
    "platform/crates/observability",
    "platform/crates/scheduling",
    "platform/crates/protocol",
    "platform/crates/discovery",
    "platform/control-plane/master",
    "platform/control-plane/control-cli",
    "platform/control-plane/node-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://gitcode.com/openJiuwen/agent-dx"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_dependencies = "deny"
