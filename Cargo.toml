[workspace]
resolver = "2"
default-members = [
    "agent/crates/core",
    "agent/crates/store",
    "agent/activator",
    "agent/api",
    "agent/cli",
    "gateway/apiserver",
    "gateway",
    "crates/error",
    "crates/observability",
    "crates/process",
    "crates/transport",
    "platform/runtime/execd",
    "platform/crates/core",
    "platform/crates/checkpoint-storage",
    "platform/crates/scheduling",
    "platform/crates/protocol",
    "platform/crates/discovery",
    "platform/coordinator",
    "platform/deployment",
    "platform/adxlet",
]
members = [
    "agent/crates/core",
    "agent/crates/store",
    "agent/activator",
    "agent/api",
    "agent/cli",
    "gateway/apiserver",
    "gateway",
    "crates/error",
    "crates/observability",
    "crates/process",
    "crates/transport",
    "platform/runtime/execd",
    "platform/crates/core",
    "platform/crates/checkpoint-storage",
    "platform/crates/scheduling",
    "platform/crates/protocol",
    "platform/crates/discovery",
    "platform/coordinator",
    "platform/deployment",
    "platform/adxlet",
    "afs",
    "afs/crates/client",
    "afs/crates/error",
    "afs/crates/logging",
    "afs/crates/metrics",
    "afs/crates/protocol",
    "afs/crates/tracing",
    "afs/crates/transport",
    "afs/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://gitcode.com/openJiuwen/agent-dx"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_dependencies = "deny"
