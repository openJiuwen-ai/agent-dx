[package]
name = "afs"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent FS process and backend foundation"
publish = false

[features]
default = ["ownerfs", "dfs", "node-jemalloc", "meta-redis", "meta-etcd"]
ownerfs = []
dfs = []
rdma = ["afs-transport/rdma"]
# Developer diagnostics compiled out of default builds: Meta store profiling
# (`AFS_META_PROFILE`) and namespace tracing (`AFS_META_NAMESPACE_TRACE`).
diagnostics = []
# Meta 操作日志的 Redis／etcd 后端（`meta/store/{redis,etcd}_log.rs`，R16）。
# 未编入时配置 `meta_store = "redis"`／`"etcd"` 在 Meta 启动时报错。
meta-redis = ["dep:redis"]
meta-etcd = ["dep:etcd-client"]
# Disable only for allocator comparisons; only afs-node installs it globally.
node-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]


[dependencies]
afs-error = { path = "crates/error" }
afs-logging = { path = "crates/logging" }
afs-metrics = { path = "crates/metrics" }
afs-protocol = { path = "crates/protocol" }
afs-tracing = { path = "crates/tracing", features = ["runtime"] }
afs-transport = { path = "crates/transport", default-features = false, features = ["grpc", "shm"] }

clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
im = "=15.1.0"
crc32c = "=0.6.8"
uuid = { version = "1", features = ["v4"] }
arc-swap = "=1.9.2"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
toml = "0.9.8"
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
prost = "0.14"
axum = "0.8"
thiserror = "2.0.16"
libc = "0.2"
blake3 = { version = "=1.8.7", features = ["rayon"] }
bao-tree = { version = "=0.16.1", default-features = false }
rayon-core = "=1.13.0"
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# Match ADX public TLS wiring; aws-base does not enable reqwest TLS by itself.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
fuser = { version = "=0.18.0", default-features = false }

# Meta 操作日志的 Redis／etcd 后端（`meta/store/{redis,etcd}_log.rs`，R16）。
redis = { version = "=1.7.0", default-features = false, features = ["tokio-comp"], optional = true }
etcd-client = { version = "=0.21.1", optional = true }

# Meta 服务端 RPC 计数层（`meta/rpc_metrics.rs`）。
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "=0.7.0", optional = true, default-features = false, features = ["background_threads_runtime_support", "stats"] }
tikv-jemalloc-ctl = { version = "=0.7.0", optional = true, features = ["use_std", "stats"] }

[dev-dependencies]
tempfile = "3"
afs-client = { path = "crates/client" }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1.47.1", features = ["test-util"] }

[lints]
workspace = true
