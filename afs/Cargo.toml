[package]
name = "afs"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent FS process and backend foundation"
publish = false

[features]
default = ["ownerfs", "dfs", "node-jemalloc"]
ownerfs = []
dfs = []
rdma = ["afs-transport/rdma"]
# Disable only for allocator comparisons; only afs-node installs it globally.
node-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[[example]]
name = "afs-workspace-probe"
path = "tests/support/workspace_probe.rs"

[[example]]
name = "afs-root-command-meta"
path = "tests/support/root_command_meta.rs"
required-features = ["ownerfs"]

[[example]]
name = "afs-meta-bench"
path = "tests/support/meta_bench.rs"
required-features = ["dfs"]

[[example]]
name = "afs-perf-denominators"
path = "tests/support/perf_denominators.rs"

[dependencies]
afs-error = { path = "common/error" }
afs-logging = { path = "common/logging" }
afs-metrics = { path = "common/metrics" }
afs-protocol = { path = "common/protocol" }
afs-tracing = { path = "common/tracing", features = ["runtime"] }
afs-transport = { path = "common/transport", default-features = false, features = ["grpc", "shm"] }

clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
im = "=15.1.0"
crc32c = "=0.6.8"
uuid = { version = "1", features = ["v4"] }
arc-swap = "=1.9.2"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
toml = "0.9.8"
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
prost = "0.14"
axum = "0.8"
thiserror = "2.0.16"
libc = "0.2"
blake3 = { version = "=1.8.7", features = ["rayon"] }
bao-tree = { version = "=0.16.1", default-features = false }
rayon-core = "=1.13.0"
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# Match ADX public TLS wiring; aws-base does not enable reqwest TLS by itself.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
fuser = { version = "=0.18.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "=0.7.0", optional = true, default-features = false, features = ["background_threads_runtime_support", "stats"] }
tikv-jemalloc-ctl = { version = "=0.7.0", optional = true, features = ["use_std", "stats"] }

[dev-dependencies]
tempfile = "3"
afs-client = { path = "client" }
hyper-util = { version = "0.1", features = ["tokio"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "trace"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
