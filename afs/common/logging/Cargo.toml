[package]
name = "afs-logging"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Process logging infrastructure"
publish = false

[dependencies]
afs-tracing = { path = "../tracing" }
log = "0.4.28"
slog = { version = "2.8.2", features = ["max_level_trace", "release_max_level_trace"] }
slog-async = "2.8.0"
slog-global = { git = "https://github.com/tikv/slog-global.git", rev = "d592f88e4dbba5eb439998463054f1a44fbf17b9", features = ["log"] }
slog-json = "2.6.1"
slog-term = "2.9.2"
thiserror = "2.0.16"

[dev-dependencies]
afs-tracing = { path = "../tracing", features = ["runtime"] }
tracing = { version = "0.1.41", features = ["log"] }
serde_json = "1.0.145"
tempfile = "3.23.0"

[lints]
workspace = true
