syntax = "proto3";
package afs.error.v1;
// Carried in google.rpc.Status.details as an Any with the AFS type URL.
message ErrorDetail { uint32 afs_code = 1; ErrorKind kind = 2; string message = 3; }
enum ErrorKind {
  UNKNOWN = 0;
  CANCELLED = 1;
  OUT_OF_RANGE = 2;
  INVALID_ARGUMENT = 3;
  NOT_FOUND = 4;
  ALREADY_EXISTS = 5;
  PERMISSION_DENIED = 6;
  RESOURCE_EXHAUSTED = 7;
  FAILED_PRECONDITION = 8;
  ABORTED = 9;
  UNIMPLEMENTED = 10;
  INTERNAL = 11;
  UNAVAILABLE = 12;
  DATA_LOSS = 13;
  UNAUTHENTICATED = 14;
  DEADLINE_EXCEEDED = 15;
}
