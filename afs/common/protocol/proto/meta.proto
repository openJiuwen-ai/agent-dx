}

// A fresh lock authority read; only missing/expired authority acquires a lease.
// operation_id identifies that conditional acquire, not the read-only result.
message ResolveDfsLockAuthorityRequest {
  string caller_id = 1;
  string owner_session_id = 2;
  string operation_id = 3;
  string inode_id = 4;
  uint64 lease_seconds = 5;
}

message ResolveDfsLockAuthorityReply {
  DfsInodeRecord inode = 1;
  DfsWriteLease write_lease = 2;
}

// A fresh writable-open authority read; only missing/expired authority acquires
// a lease. lease_seconds is the missing/expired acquisition TTL, not a promise
// that every live resolution extends the owner lifetime. operation_id identifies
// that conditional acquire, not the read-only result.
message ResolveDfsWriteAuthorityRequest {
  string caller_id = 1;
  string owner_session_id = 2;
  string operation_id = 3;
  string inode_id = 4;
  uint64 lease_seconds = 5;
}

message ResolveDfsWriteAuthorityReply {
  DfsInodeRecord inode = 1;
  DfsWriteLease write_lease = 2;
}

