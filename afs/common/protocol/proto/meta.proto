  DFS_COPY_ROLE_UNSPECIFIED = 0;
  DFS_COPY_ROLE_DURABLE_REPLICA = 1;
  DFS_COPY_ROLE_VERIFIED_CACHE = 2;
  DFS_COPY_ROLE_EXTERNAL_COMMITTED = 3;
}

