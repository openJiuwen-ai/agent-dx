  string copy_id = 1;
  string chunk_id = 2;
  DfsCopyRole role = 3;
  DfsCopyState state = 4;
  DfsCopyLocation location = 5;
  optional string data_endpoint = 6;
  uint32 load_hint = 7;
  DfsReadGrant read_grant = 8;
}

