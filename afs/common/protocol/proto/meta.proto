message CommitFileVersionRequest {
  string caller_id = 1;
  string operation_id = 2;
  string inode_id = 3;
  uint64 expected_inode_revision = 4;
  string expected_head_version_id = 5;
  DfsFileVersion version = 6;
  DfsLayoutRoot layout = 7;
  repeated DfsChunkReceipt chunk_receipts = 8;
  DfsWriteLease write_lease = 9;
  DfsCommitMetadataDelta metadata_delta = 10;
}

message CommitFileVersionReply {
  DfsInodeRecord inode = 1;
}

// Receiver-authenticated, batched authority check. No file bytes traverse Meta.
message DfsReadValidation {
  DfsReadGrant grant = 1;
  string chunk_id = 2;
  string copy_id = 3;
  uint64 chunk_offset = 4;
  uint64 length = 5;
}
message DfsAuthorizedRead {
  DfsReadValidation validation = 1;
  message Range { uint64 offset = 1; uint64 length = 2; }
  repeated Range allowed_ranges = 2;
  uint64 expires_at_unix_ms = 3;
}
message ValidateDfsReadGrantsRequest {
  string receiver_node_id = 1;
  uint64 receiver_node_epoch = 2;
  string peer_node_id = 3;
  repeated DfsReadValidation validations = 4;
}
message ValidateDfsReadGrantsReply { repeated DfsAuthorizedRead authorizations = 1; }
