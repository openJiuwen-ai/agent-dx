  message Node {
    string node_id = 1;
    uint64 node_epoch = 2;
    string device_id = 3;
    uint64 device_epoch = 4;
    uint64 catalog_revision = 5;
  }
  message External {
    string store_id = 1;
    string object_key = 2;
    string object_revision = 3;
  }
  oneof location {
    Node node = 1;
    External external = 2;
  }
}

