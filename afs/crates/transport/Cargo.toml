[package]
name = "afs-transport"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared transport mechanisms and optional data-channel module boundaries"
publish = false

[features]
default = ["grpc"]
grpc = ["dep:thiserror", "dep:tonic", "dep:afs-error", "dep:afs-protocol", "dep:prost", "dep:prost-types", "dep:tonic-types", "dep:tokio", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:hyper-util", "dep:tower", "dep:futures-util", "dep:afs-logging", "dep:blake3", "dep:rustls"]
rdma = []
shm = ["dep:libc", "dep:nix"]

[dependencies]
tokio = { version = "1.47.1", features = ["net", "io-util", "time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
futures-util = { version = "0.3", optional = true }
afs-logging = { path = "../logging", optional = true }
blake3 = { version = "1", optional = true }
prost-types = { version = "0.14", optional = true }
tonic-types = { version = "0.14", optional = true }
afs-error = { path = "../error", optional = true }
afs-protocol = { path = "../protocol", optional = true }
prost = { version = "0.14", optional = true }
thiserror = { version = "2.0.16", optional = true }
tonic = { version = "0.14.6", features = ["tls-ring"], optional = true }
libc = { version = "0.2", optional = true }
nix = { version = "0.29", features = ["socket", "uio"], optional = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3"
# 仅供真实 TCP socket 测试使用，复用工作区已锁定的库，不进入生产依赖。
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "rt-multi-thread"] }
tokio-stream = { version = "0.1.17", features = ["net"] }

[lints]
workspace = true

[[test]]
name = "tcp_config"
required-features = ["grpc"]
