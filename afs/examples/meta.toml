id = "meta"
fs = "all"
grpc_listen = "127.0.0.1:7400"
rest_listen = "127.0.0.1:7401"
meta_store = "local-file"
data_dir = "/opt/adx/data/afs/meta"
# DFS replication is a filesystem initialization contract. These R1 defaults
# must remain unchanged on later starts unless the filesystem is reinitialized.
dfs_desired_copies = 1
dfs_sync_required_copies = 1
dfs_min_distinct_nodes = 1
dfs_min_distinct_failure_domains = 1
dfs_local_copy = "required"
log_level = "info"
trace_enabled = false

tls_ca_certificate = "/opt/adx/config/afs/tls/ca.pem"
tls_identity_certificate = "/opt/adx/config/afs/tls/meta.pem"
tls_identity_private_key = "/opt/adx/config/afs/tls/meta-key.pem"
tls_server_name = "afs-cluster"

[trusted_node_certs]
node-a = "/opt/adx/config/afs/tls/node-a.pem"
