[package]
name = "adx-credential-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace-scoped credential envelope encryption with an internal HTTPS boundary"

[lints]
workspace = true

[dependencies]
adx-agent-core = { path = "../crates/core" }
adx-transport = { path = "../../crates/transport" }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs"] }
zeroize = "1"

[dev-dependencies]
adx-activator = { path = "../activator" }
adx-agent-store = { path = "../crates/store", features = ["test-memory"] }
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
