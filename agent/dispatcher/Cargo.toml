[package]
name = "adx-dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
adx-agent-core = { path = "../crates/core" }
adx-agent-store = { path = "../crates/store" }
async-trait = "0.1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
adx-agent-store = { path = "../crates/store", features = ["test-memory"] }
