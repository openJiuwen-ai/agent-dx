<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">Agent DX architecture</title>
  <desc id="desc">Gateway Ingress hosts the Agent API. Stateless Activators manage Template and Environment metadata in a separate Redis namespace and activate one stable Sandbox through the Gateway Sandbox adapter. Inline lifecycle calls use that adapter directly. User Harness HTTP, WebSocket and SSH traffic follows Ingress and Relay. Platform owns Environment lifecycle and Execd owns the user process. API Server embeds Ingress by default; adxlet embeds Relay. Both pairs support separate processes.</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#0d806c" stroke-width="1.5"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:#17263d }
      .title { font-size:34px; font-weight:700 } .section { font-size:13px; font-weight:700; letter-spacing:1.5px; fill:#64748b }
      .name { font-size:23px; font-weight:700 } .body { font-size:17px } .small { font-size:15px; fill:#52647b }
      .control { fill:none; stroke:#2563eb; stroke-width:2.3; marker-end:url(#blue) }
      .data { fill:none; stroke:#0d806c; stroke-width:3; marker-end:url(#green) }
      .support { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#gray) }
      .label { font-size:14px; fill:#2563eb; paint-order:stroke; stroke:#f8fafc; stroke-width:5px; stroke-linejoin:round }
      .dataLabel { font-size:14px; fill:#0d806c; paint-order:stroke; stroke:#f8fafc; stroke-width:5px }
    </style>
  </defs>
  <rect width="1440" height="1100" rx="20" fill="#f8fafc"/>
  <text x="48" y="60" class="title">Agent DX</text>
  <text x="48" y="90" class="body" fill="#52647b">Agent product · shared access · Environment execution platform</text>
  <text x="1392" y="62" text-anchor="end" class="small">SYSTEM ARCHITECTURE</text>

  <rect x="48" y="120" width="1344" height="116" rx="16" fill="#f1edff" stroke="#ded6f5"/>
  <text x="72" y="146" class="section">PRODUCT &amp; PUBLIC CONTRACT</text>
  <text x="72" y="179" class="name">Stateless Activator</text>
  <text x="72" y="207" class="small">Template / Environment · agent/activator</text>
  <path d="M450 182H535" class="support"/>
  <text x="565" y="179" class="name">Agent Redis</text>
  <text x="565" y="207" class="small">Product metadata</text>
  <text x="888" y="179" class="name">Agent clients / Sandbox SDK</text>
  <text x="888" y="207" class="small">Public HTTPS APIs / Harness traffic</text>

  <rect x="48" y="284" width="300" height="648" rx="16" fill="#edf8f5" stroke="#c8e7de"/>
  <text x="72" y="312" class="section">SHARED ACCESS / GATEWAY</text>
  <rect x="72" y="350" width="252" height="156" rx="12" fill="white" stroke="#97cfbe"/>
  <text x="94" y="386" class="name">Ingress</text>
  <text x="94" y="415" class="body">HTTPS / API Key</text>
  <text x="94" y="442" class="body">Route &amp; auth caches</text>
  <text x="94" y="470" class="small">Control + data entrypoint</text>
  <text x="72" y="566" class="small">Coordinator publishes routes.</text>
  <text x="72" y="591" class="small">Data requests use caches</text>
  <text x="72" y="616" class="small">and local binding checks.</text>
  <text x="72" y="685" class="small">Agent API → Activator</text>
  <text x="72" y="710" class="small">Inline → Sandbox adapter</text>
  <text x="72" y="735" class="small">Sandbox adapter → Platform RPC</text>

  <rect x="430" y="284" width="398" height="648" rx="16" fill="#eef3ff" stroke="#d0dcf4"/>
  <text x="454" y="312" class="section">CONTROL PLANE / PLATFORM</text>
  <rect x="454" y="350" width="350" height="108" rx="12" fill="white" stroke="#b5c9f0"/>
  <text x="476" y="384" class="name">API Server</text>
  <text x="476" y="411" class="body">Sandbox HTTP API · ownership cache</text>
  <text x="476" y="437" class="small">API Key verification / tenant context</text>
  <rect x="454" y="520" width="350" height="205" rx="12" fill="white" stroke="#b5c9f0"/>
  <text x="476" y="555" class="name">Coordinator</text>
  <text x="476" y="583" class="body">Global: round-robin across shards</text>
  <rect x="476" y="600" width="306" height="72" rx="8" fill="#eef3ff"/>
  <text x="490" y="627" class="body" font-weight="600">Shard scheduling (in process)</text>
  <text x="490" y="654" class="small">Tenant queue · Filter / Score · reserve</text>
  <text x="476" y="700" class="small">Node registry · results · route publication</text>
  <rect x="454" y="799" width="350" height="103" rx="12" fill="white" stroke="#b5c9f0"/>
  <text x="476" y="833" class="name">Redis</text>
  <text x="476" y="860" class="body">Cluster state + Coordinator discovery</text>
  <text x="476" y="884" class="small">Single instance · persistent disk · AOF</text>

  <rect x="930" y="284" width="462" height="648" rx="16" fill="#fff7e9" stroke="#efddbc"/>
  <text x="954" y="312" class="section">WORKER NODE</text>
  <rect x="954" y="350" width="366" height="108" rx="12" fill="white" stroke="#dcc391"/>
  <text x="976" y="384" class="name">Relay</text>
  <text x="976" y="411" class="body">Local binding / generation checks</text>
  <text x="976" y="437" class="small">HTTP/2 CONNECT → target TCP</text>
  <rect x="954" y="536" width="366" height="133" rx="12" fill="white" stroke="#dcc391"/>
  <text x="976" y="573" class="name">adxlet</text>
  <text x="976" y="602" class="body">Environment lifecycle · local admission</text>
  <text x="976" y="629" class="body">RuntimeDriver · reconcile</text>
  <text x="976" y="652" class="small">StateSink → Coordinator → Redis</text>
  <rect x="954" y="728" width="366" height="68" rx="12" fill="white" stroke="#dcc391"/>
  <text x="976" y="757" class="name">sandboxd</text>
  <text x="976" y="782" class="small">External service · runtime execution</text>
  <rect x="954" y="835" width="366" height="77" rx="12" fill="#fff0d4" stroke="#dcc391"/>
  <text x="976" y="864" class="name">Runtime: Execd + Harness</text>
  <text x="976" y="891" class="small">Commands / files / ports · HTTP control</text>

  <path d="M180 236V350" class="support"/>
  <path d="M280 350V236" class="control"/>
  <text x="96" y="252" class="small">Sandbox API</text>
  <text x="285" y="278" class="small">Agent API</text>
  <path d="M1182 236V260H60V376H72" class="support"/>
  <text x="648" y="254" class="small">Public HTTPS requests</text>
  <path d="M324 402H454" class="control"/>
  <text x="387" y="390" text-anchor="middle" class="label">Loopback HTTP · one process</text>
  <path d="M324 364H380V332H1370V404H1320" class="data"/>
  <text x="857" y="326" text-anchor="middle" class="dataLabel">Data: HTTP/2 CONNECT</text>
  <path d="M629 458V520" class="control"/>
  <text x="641" y="491" class="label">Create / lookup RPC</text>
  <path d="M804 428H862V555H954" class="control"/>
  <text x="880" y="543" text-anchor="middle" class="label">Delete RPC</text>
  <path d="M804 600H954" class="control"/>
  <text x="877" y="589" text-anchor="middle" class="label">Assignment RPC</text>
  <path d="M954 641H804" class="control"/>
  <text x="877" y="663" text-anchor="middle" class="label">Report / commit</text>
  <path d="M1137 536V458" class="control"/>
  <text x="1150" y="497" class="label">Bindings / UDS</text>
  <path d="M1137 669V728" class="control"/>
  <text x="1149" y="705" class="label">gRPC / UDS</text>
  <path d="M1137 796V835" class="support"/>
  <text x="1150" y="820" class="small">Starts runtime</text>
  <path d="M1320 427H1346V873H1320" class="data"/>
  <path d="M954 623H922V873H954" class="control"/>
  <text x="909" y="862" class="label" transform="rotate(-90 909 862)">Execd HTTP control</text>
  <path d="M629 725V799" class="control"/>
  <text x="641" y="767" class="label">Persist / discover</text>
  <path d="M454 693H394V481H324" class="control"/>
  <text x="408" y="698" class="label" transform="rotate(-90 408 698)">Full + delta routes / gRPC</text>

  <rect x="48" y="958" width="1344" height="96" rx="14" fill="#e8edf3"/>
  <text x="72" y="990" class="body" font-weight="600">Deployment: adxctl supervisor + unified release · native processes or processes inside Kubernetes Pods</text>
  <text x="72" y="1018" class="small">API Server embeds Ingress; adxlet embeds Relay. Both pairs support explicit split-process deployment. sandboxd remains external.</text>
  <path d="M72 1075H112" class="control"/><text x="124" y="1080" class="small">Control / state</text>
  <path d="M292 1075H332" class="data"/><text x="344" y="1080" class="small">User data</text>
  <path d="M488 1075H528" class="support"/><text x="540" y="1080" class="small">Product / public access</text>
  <text x="1392" y="1080" text-anchor="end" class="small">Single Coordinator · embedded Shards</text>
</svg>
