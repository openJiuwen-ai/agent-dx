<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">ADX 当前组件架构</title><desc id="desc">Gateway Ingress 装配 Agent API。无状态 Activator 保存 Template/Environment 到独立 Redis 命名空间，通过 Gateway Sandbox 适配器按稳定身份创建实例。inline 直接调用适配器。用户 Harness 通过共享 HTTP/WS/SSH 转发访问。Platform 管 Environment 生命周期，Execd 管用户进程。API Server 与 Ingress、adxlet 与 Relay 均支持共进程或拆分部署。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#516b83"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#17324d} .head{font-size:20px;font-weight:650}.body{font-size:15px}.small{font-size:13px;fill:#526b7c}.ingress{fill:none;stroke:#516b83;stroke-width:2;marker-end:url(#arrow)}.box{stroke:#b7ccd9;stroke-width:1.5;rx:12}</style>
<rect width="1120" height="840" fill="#f5f8fb" rx="18"/>
