id = "node-a"
grpc_listen = "127.0.0.1:7500"
rest_listen = "127.0.0.1:7501"
meta_endpoint = "https://127.0.0.1:7400"
peer_endpoint = "https://127.0.0.1:7500"
fs = "all"
data_mode = "grpc"
data_dir = "/opt/adx/data/afs/node-a"
uds_path = "/opt/adx/run/afs/node-a.sock"
# ownerfs_mount = "/mnt/adx/ownerfs"
# dfs_mount = "/mnt/adx/dfs"
# FUSE receive/executor settings shared by OwnerFs and DFS.
# fuse_threads = 4
# fuse_clone_fd = true
# fuse_workers = 32
# Native DFS page reuse requires the exact fresh committed version and length.
# Zero TTLs preserve strict close-to-open; positive TTLs explicitly relax it.
# dfs_fuse_keep_cache = true
# dfs_fuse_entry_ttl_ms = 0
# dfs_fuse_attr_ttl_ms = 0
# Requested DFS kernel read-ahead limit; record the negotiated value in tests.
# This does not enable next-object prefetch or change OwnerFs cache policy.
# fuse_max_readahead_bytes = 1048576
# Resident immutable metadata entries, not a byte or authorization budget.
# dfs_version_cache_entries = 4096
# Cache-retained metadata estimate; active reader Arcs and Node RSS are separate.
# Includes layout/index capacities, ID buffers and conservative cache-table overhead.
# dfs_version_cache_bytes = 33554432
# Catalog request count, independent of body/proof budgets.
dfs_catalog_commit_queue = 256
# Bounded native cache flight records, valid range 1..=8.
# This does not enable multiple body fills or object prefetch.
# dfs_fetch_max_inflight_objects = 8
# Native body readahead is opt-in; product profiles may explicitly use 8388608.
# This is scheduling distance, sharing the existing proof/stream/disk budgets.
# dfs_readahead_max_bytes = 0
# A-side verified Peer payloads: 2 resident objects, sharing 16MiB with live frames.
# Payload range 4..=64MiB; eviction does not refund still-referenced data.
# dfs_peer_serve_resident_objects = 2
# dfs_peer_serve_payload_bytes = 16777216
# One native admission deadline; 0 disables waiting, maximum 50ms.
# dfs_peer_serve_wait_ms = 20
# Metadata-only source lookahead; no object/body prefetch. Zero max/bytes disables retention.
# dfs_source_cache_max_ms = 5000
# dfs_source_lookahead_chunks = 64
# dfs_source_cache_bytes = 4194304
# Native DFS Node defaults: independent IDs, 32KiB CRC32C and write-generation GC.
# Replica counts/local-copy policy remain the existing filesystem policy.
# S3 and OwnerFs-only do not enable these native defaults.
# dfs_crc32c_writes = true
# dfs_optimistic_gc_commit = true
timeout_ms = 5000
log_level = "info"
trace_enabled = false
trace_sample_ratio = 1.0
trace_endpoint = "http://127.0.0.1:4317"

# OwnerFs workspace bind mount stays OFF. This legacy option controls only
# the runc experiment; it does not expose a standalone host-visible bind.
# Existing TOML/CLI names remain compatible; see docs/deployment/afs.md.
experimental_native_workspace = false

# Independent administrator-controlled host entry, also OFF by default.
# Create and authorize the Home workspace through OwnerFs before enabling this.
# Only one already-existing local Home workspace is supported. Stop managed
# users before shutdown/root changes; native FDs are not instantly revocable.
# Do not enable both experimental entries together.
experimental_ownerfs_workspace_bind = false
# [ownerfs_workspace_bind]
# workspace = "agent1"

# Generate this local-only material with prepare-local-tls.sh. The shared DNS
# name is present in both local server certificates for this loopback example.
tls_ca_certificate = "/opt/adx/config/afs/tls/ca.pem"
tls_identity_certificate = "/opt/adx/config/afs/tls/node-a.pem"
tls_identity_private_key = "/opt/adx/config/afs/tls/node-a-key.pem"
tls_server_name = "afs-cluster"

# Native DFS live uploads and unpublished metadata. S3 keeps its separate budgets.
dfs_dirty_budget_bytes = 67108864
dfs_unpublished_descriptors = 1024
dfs_upload_inflight_chunks = 8
# Scheduling period, not a guaranteed publication deadline.
dfs_background_commit_ms = 5000

# Write-body pool idle capacity is independent of the native live limit above.
# Zero disables idle retention. This does not change S3 pipeline budgets.
dfs_write_buffer_idle_bytes = 134217728

[trusted_node_certs]
node-a = "/opt/adx/config/afs/tls/node-a.pem"

# Optional external S3 durability for a NEW DFS filesystem only.
# Configure the same store/generation on Meta and every DFS Node; retain R1
# default counts. External mode does not use Node durable replicas.
# Service deployment is external. See docs/deployment/afs.md.
# [dfs_external_backend]
# store_id = "filesystem-a"
# generation = "generation-1"
# endpoint = "https://s3.example.com"
# bucket = "afs-chunks"
# region = "us-east-1"
# allow_http = false
# credentials_file = "/opt/adx/config/afs/s3-credentials.json"

# Optional Node-only disposable cache. Omit this table for cache OFF.
# Use a dedicated private directory owned by the Node process (mode 0700).
# [dfs_external_backend.cache]
# directory = "/opt/adx/data/afs/s3-cache"
# capacity_bytes = 268435456
# pending_bytes = 37748736
# cache_large_write = false
