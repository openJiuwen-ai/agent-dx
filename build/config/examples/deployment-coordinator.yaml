schema_version: 1
package_dir: /opt/adx/current
state_dir: /opt/adx/run/coordinator
redis_url: redis://redis.internal:6379/
namespace: adx
restart_limit: 3
restart_delay_ms: 1000
stop_timeout_seconds: 90
services:
  - id: coordinator
    role: coordinator
    config:
      listen: 0.0.0.0:19000
      scheduler_shards: 1
      placement: pack
      rpc_timeout_seconds: 30
      tls:
        ca: /opt/adx/config/tls/ca.pem
        certificate: /opt/adx/config/tls/coordinator.pem
        private_key: /opt/adx/config/tls/coordinator.key
        server_name: adx.internal
        peers:
          apiserver: /opt/adx/config/tls/apiserver.der
          node:node-1: /opt/adx/config/tls/node-1.der
          ingress: /opt/adx/config/tls/ingress.der
      bootstrap_credentials:
        - key_file: /opt/adx/config/secrets/admin-key
          tenant_id: admin
          administrator: true
          expires_at_unix_seconds: 0
      advertised_address: https://coordinator.internal:19000
      heartbeat_timeout_seconds: 30
      discovery_ttl_seconds: 15
      metrics_listen: 127.0.0.1:19090
logging:
  enabled: true
  max_file_bytes: 104857600
  rotate_seconds: 86400
  compress: true
  max_files: 5
  max_age_seconds: 604800
  max_total_bytes: 1073741824
runtime_profile:
  rootfs:
    runtime_class: runsc
    type: local
    path: /opt/adx/current/runtime/adx-runtime-rootfs.img
    readonly: false
  bootstrap:
    type: erofs
    root: /opt/adx/current/runtime/adx-runtime-rootfs.img
    target: /__adx
    entrypoint:
      - /__adx/usr/local/bin/adx-execd
    image_process_config: /etc/adx-image-process.json
  env:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
