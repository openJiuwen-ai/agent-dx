<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">ADX 当前组件架构</title><desc id="desc">Agent 目标经 Sandbox SDK 接入，当前尚未迁移；控制链路经过 Go API、Master 与 Node Manager，数据链路经过 Edge、Node Proxy 与 RRT。Redis 持久化与 SQLite 降级分开。</desc>
