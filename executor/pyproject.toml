[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dx-executor"
dynamic = ["version"]
description = "Platform executor for openYuanRong custom-image Agent instances"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "openyuanrong"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
