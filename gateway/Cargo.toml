[package]
name = "data-plane-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADX edge, node proxy, and data-plane forwarding services"

[lints]
workspace = true

[lib]
name = "data_plane_gateway"
path = "src/lib.rs"

[[bin]]
name = "adx-node-proxy"
path = "src/bin/node_proxy.rs"
required-features = ["activity-client"]

[[bin]]
name = "adx-edge-frontend"
path = "src/bin/edge_frontend.rs"
required-features = ["activity-client"]

[[bin]]
name = "adx-data-plane-forward"
path = "src/bin/data_plane_forward.rs"

[features]
default = ["activity-client"]
activity-client = ["dep:prost", "dep:tonic", "dep:tower"]
etcd-watch = ["dep:etcd-client"]
mock-e2e = []
agent-api = ["activity-client", "dep:adx-agent-core", "dep:adx-agent-api"]

[dependencies]
adx-agent-core = { path = "../agent/crates/core", optional = true }
adx-agent-api = { path = "../agent/api", optional = true }
adx-observability = { path = "../crates/observability" }
adx-process = { path = "../crates/process" }
adx-transport = { path = "../crates/transport" }
adx-protocol = { path = "../platform/crates/protocol" }
adx-discovery = { path = "../platform/crates/discovery" }
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
percent-encoding = "2"
h2 = "0.4"
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
etcd-client = { version = "0.14", optional = true, features = ["tls"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
ipnet = "2"
libc = "0.2"
prost = { version = "0.13", optional = true }
arc-swap = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tonic = { version = "0.12", optional = true, features = ["transport"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "io-std", "time", "signal", "sync", "fs"] }
tower = { version = "0.5", optional = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio-tungstenite = "0.24"
tokio-stream = { version = "0.1", features = ["net"] }

[dev-dependencies]
adx-activator = { path = "../agent/activator" }
adx-agent-store = { path = "../agent/crates/store", features = ["test-memory"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
