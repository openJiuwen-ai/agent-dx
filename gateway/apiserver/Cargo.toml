[package]
name = "adx-apiserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADX public HTTP API and instance ownership cache"

[lints]
workspace = true

[dependencies]
adx-core = { path = "../../platform/crates/core" }
adx-protocol = { path = "../../platform/crates/protocol" }
adx-error = { path = "../../crates/error" }
adx-process = { path = "../../crates/process" }
adx-transport = { path = "../../crates/transport" }
adx-discovery = { path = "../../platform/crates/discovery" }
adx-observability = { path = "../../crates/observability" }
data-plane-gateway = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tonic = { version = "0.12", features = ["tls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
futures-util = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
