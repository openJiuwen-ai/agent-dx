openapi: "3.1.0"
info:
  title: ADX Environment Runtime Data Plane API
  version: "1.0.0"
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Typed runtime operations exposed by Ingress at `/direct/{environmentId}`. Ingress
    resolves the Environment route, Relay verifies the current Runtime binding,
    and EXECD executes the operation inside that Runtime. These calls bypass lifecycle and
    scheduling queues once the Environment is Running. Authorized demand for a
    paused Environment first waits for a committed restore and route at Ingress.
    A finite processing timeout covers the entire HTTP request at Ingress;
    cancellation of its wait does not cancel the durable restore.

    Generic application port forwarding and reverse tunnels transport arbitrary
    user protocols and are intentionally outside this typed contract.
servers:
  - url: https://{address}
    variables:
      address:
        default: adx.example.com
security:
  - bearerAuth: []
  - xAuth: []
tags:
  - name: Runtime
    description: Typed operations executed by EXECD inside a Environment Runtime.
  - name: Files
    description: Streaming and resumable file transfer.
  - name: Commands
    description: Process and shell execution plus command status observation.
paths:
  /direct/{environmentId}/healthz:
    get:
      tags: [Runtime]
      operationId: runtimeHealth
      summary: Check whether the target EXECD listener is reachable
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ProcessingTimeout"
      responses:
        "200":
          description: EXECD is ready.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, const: ok}
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /direct/{environmentId}/invoke:
    post:
      tags: [Runtime, Commands]
      operationId: invokeRuntimeAction
      summary: Invoke a process, shell or file action inside the Environment Runtime
      description: |
        `action` selects an EXECD operation. Mutating calls should carry one
        `X-ADX-Request-ID`; retry an unknown result with the same ID.
        `process.wait` returns HTTP 200 with `status: running`,
        `error_code: WAIT_TIMEOUT` and no `exit_code` when only its wait deadline
        expires; the command keeps running. `process.kill` returns HTTP 200 with
        `killed: false` when the command is absent or already exited. Other
        operation errors retain their normal error status.
        Command results include optional exit_signal (the actual POSIX signal).
        SIGKILL or shell exit_code 137 alone does not prove OOM. EXECD does not
        collect OOM counters. A backend-wide OOM withdraws its data route;
        consult the authenticated /api/instances view for failure.reason:
        OomKilled, rather than inferring OOM from 502/503.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ProcessingTimeout"
        - $ref: "#/components/parameters/OperationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "503":
          $ref: "#/components/responses/DemandUnavailable"
        "200":
          description: Action-specific JSON result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvokeResult"}
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /direct/{environmentId}/upload:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Upload a file or tar stream, optionally in resumable chunks
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ProcessingTimeout"
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/TransferType"
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/Offset"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              contentEncoding: binary
      responses:
        "503":
          $ref: "#/components/responses/DemandUnavailable"
        "200":
          description: Upload or chunk accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadResult"}
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /direct/{environmentId}/upload/status:
    get:
      tags: [Files]
      operationId: getUploadStatus
      summary: Query resumable upload progress
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ProcessingTimeout"
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/UploadIdRequired"
      responses:
        "503":
          $ref: "#/components/responses/DemandUnavailable"
        "200":
          description: Current committed offset and upload identity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadStatus"}
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /direct/{environmentId}/upload/commit:
    post:
      tags: [Files]
      operationId: commitUpload
      summary: Atomically publish a completed resumable upload
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ProcessingTimeout"
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/UploadIdRequired"
        - $ref: "#/components/parameters/TotalSize"
      responses:
        "503":
          $ref: "#/components/responses/DemandUnavailable"
        "200":
          description: Temporary upload content was committed to the target path.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadResult"}
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /direct/{environmentId}/download:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download a file or tar stream
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ProcessingTimeout"
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/TransferType"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: "^bytes=[0-9]+-[0-9]*$"
      responses:
        "503":
          $ref: "#/components/responses/DemandUnavailable"
        "200":
          description: Complete file or tar stream.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                contentEncoding: binary
        "206":
          description: Requested byte range.
          headers:
            Content-Range:
              schema: {type: string}
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
                contentEncoding: binary
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /direct/{environmentId}/pty:
    get:
      tags: [Commands]
      operationId: openPty
      summary: Open an interactive process over a WebSocket
      description: |
        Upgrade to WebSocket. Binary client frames are process input and binary
        server frames are PTY output. JSON text frames report the started and
        exited lifecycle events; `RESIZE:<cols>:<rows>` and `STDIN_EOF` are
        client control frames. OpenAPI does not standardize WebSocket frames,
        so the extension records the complete framing boundary. After sending
        exited and Close, Execd completes the peer Close handshake before closing
        TCP, with a five-second deadline for an unresponsive peer.
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ProcessingTimeout"
        - name: command
          in: query
          required: true
          description: One repeated query item per argv element.
          schema: {type: array, minItems: 1, maxItems: 256, items: {type: string, minLength: 1}}
        - name: rows
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 65535, default: 24}
        - name: cols
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 65535, default: 80}
        - name: protocol
          in: query
          required: false
          schema: {type: string, const: environment.pty.v1}
        - name: Upgrade
          in: header
          required: true
          schema: {type: string, const: websocket}
        - name: Connection
          in: header
          required: true
          schema: {type: string}
      responses:
        "503":
          $ref: "#/components/responses/DemandUnavailable"
        "101":
          description: WebSocket protocol switched.
          x-adx-websocket:
            upstream: /pty
            clientBinary: stdin bytes
            serverBinary: PTY output bytes
            clientText: ["RESIZE:<cols>:<rows>", "STDIN_EOF"]
            serverText: JSON lifecycle frames
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /api/environment/v1/commands/watch:
    get:
      tags: [Commands]
      operationId: watchCommands
      summary: Open the multiplexed command-status WebSocket
      description: |
        Upgrade to WebSocket, then subscribe to command identities. OpenAPI does
        not standardize WebSocket frames; the extension records this boundary.
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: {type: string, const: websocket}
        - name: Connection
          in: header
          required: true
          schema: {type: string}
      responses:
        "503":
          $ref: "#/components/responses/DemandUnavailable"
        "101":
          description: WebSocket protocol switched.
          x-adx-websocket:
            upstream: /commands/watch
            messages: JSON text frames
        "4XX":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Tenant or administrator API Key validated at Ingress.
    xAuth:
      type: apiKey
      in: header
      name: X-Auth
      description: Compatibility API Key header.
  parameters:
    InstanceId:
      name: environmentId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ProcessingTimeout:
      name: X-ADX-Processing-Timeout-Ms
      in: header
      required: false
      description: |
        One processing deadline after headers arrive at Ingress, shared by auth,
        route lookup, demand restore, route delivery, connection admission and
        upstream request/response streaming. The header is removed upstream.
        Without it, restore and route delivery share a 300-second wait; forwarding
        retains its existing lifetime. SDK retries each get the same configured
        timeout, with a configurable communication margin on the client.
      schema: {type: integer, minimum: 1, maximum: 86400000}
    OperationId:
      name: X-ADX-Request-ID
      in: header
      required: false
      description: Logical write identity, retained across a retry of the same unknown result.
      schema: {type: string, minLength: 1, maxLength: 128}
    FilePath:
      name: path
      in: query
      required: true
      schema: {type: string, minLength: 1}
    TransferType:
      name: type
      in: query
      required: false
      schema: {type: string, enum: [file, tar], default: file}
    UploadId:
      name: uploadId
      in: query
      required: false
      schema: {type: string, minLength: 1}
    UploadIdRequired:
      name: uploadId
      in: query
      required: true
      schema: {type: string, minLength: 1}
    Offset:
      name: offset
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 0}
    TotalSize:
      name: totalSize
      in: query
      required: false
      description: Expected final size; commit conflicts when the uploaded part differs.
      schema: {type: integer, format: int64, minimum: 0}
  responses:
    RuntimeError:
      description: Gateway routing, authorization or EXECD operation error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/RuntimeError"
              - $ref: "#/components/schemas/GatewayError"
    DemandUnavailable:
      description: |
        Readiness waiting expired before forwarding, or a temporary gateway failure.
        Only ENV_RESUMING with the reserved response marker, matching request ID and
        requestForwarded=false is an authoritative safe demand retry. The restore
        remains pending independently of this HTTP request.
      headers:
        Retry-After:
          schema: {type: string}
          description: Demand retry delay in seconds, normally 1.
        X-ADX-Error-Code:
          schema: {type: string, const: ENV_RESUMING}
          description: Ingress-owned marker; removed from upstream replies.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/GatewayError"
              - $ref: "#/components/schemas/RuntimeError"
        text/plain:
          schema: {type: string}
  schemas:
    GatewayError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retry, outcome, requestForwarded]
          properties:
            code: {type: string, enum: [ENV_RESUMING, ENV_UNAVAILABLE, PROCESSING_DEADLINE_EXCEEDED]}
            message: {type: string}
            retry: {type: string, enum: [same_operation, never]}
            outcome: {type: string, enum: [not_started, unknown]}
            requestForwarded: {type: boolean}
            requestId: {type: string}
            environmentId: {type: string}
    ExecArgs:
      type: object
      properties:
        command:
          type: string
          default: ''
        cmd:
          type: string
        cwd:
          type:
          - string
          - 'null'
          description: Must already exist; this override never creates directories.
        working_dir:
          type:
          - string
          - 'null'
        envs:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        env:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        timeout:
          type: number
          minimum: 0
          description: Execution timeout in seconds; omitted waits without a command deadline. Zero is an immediate
            deadline.
      required: []
      additionalProperties: false
    StartArgs:
      type: object
      properties:
        command_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
          description: Stable command identity; retain for retries of identical arguments.
        command:
          type: string
          default: ''
        cmd:
          type: string
        cwd:
          type:
          - string
          - 'null'
          description: Must already exist; this override never creates directories.
        envs:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        want_stdin:
          type: boolean
          default: false
        timeout:
          type: number
          minimum: 0
          description: Execution timeout; omitted or zero disables it.
      required: []
      additionalProperties: false
    CommandIdentity:
      type: object
      properties:
        command_id:
          type: string
          minLength: 1
        pid:
          type: integer
          format: int64
      required: []
      additionalProperties: false
      anyOf:
      - required:
        - command_id
      - required:
        - pid
      description: Prefer command_id. PID fallback is retained for older clients. If both are sent, command_id is
        authoritative.
    CommandPollArgs:
      type: object
      properties:
        command_id:
          type: string
          minLength: 1
        pid:
          type: integer
          format: int64
        wait_timeout:
          type: number
          minimum: 0
          default: 0
      required: []
      additionalProperties: false
      anyOf:
      - required:
        - command_id
      - required:
        - pid
    CommandWaitArgs:
      type: object
      properties:
        command_id:
          type: string
          minLength: 1
        pid:
          type: integer
          format: int64
        timeout:
          type: number
          minimum: 0
          description: Wait deadline only; timeout leaves the process running. Omission waits without a deadline.
      required: []
      additionalProperties: false
      anyOf:
      - required:
        - command_id
      - required:
        - pid
    StdinArgs:
      type: object
      properties:
        command_id:
          type: string
          minLength: 1
        pid:
          type: integer
          format: int64
        data:
          type: string
          default: ''
        eof:
          type: boolean
          default: false
      required: []
      additionalProperties: false
      anyOf:
      - required:
        - command_id
      - required:
        - pid
    EmptyArgs:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    EntrypointArgs:
      type: object
      properties:
        wait_timeout:
          type: number
          minimum: 0
          default: 10
          description: Wait up to this many seconds, clamped to 30; does not kill the entrypoint.
      required: []
      additionalProperties: false
    FilePathArgs:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
      required:
      - path
      additionalProperties: false
    FileReadArgs:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
        binary:
          type: boolean
          default: false
      required:
      - path
      additionalProperties: false
    FileWriteArgs:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
        data:
          type: string
        binary:
          type: boolean
          default: false
          description: True selects hex bytes; false writes UTF-8 text.
      required:
      - path
      - data
      additionalProperties: false
    FileWriteChunkArgs:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
        data:
          type: string
          pattern: ^(?:[0-9a-fA-F]{2})*$
          description: Hex-encoded bytes, not base64.
        offset:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Zero creates/truncates; later offsets seek before writing.
      required:
      - path
      - data
      additionalProperties: false
    FileReadChunkArgs:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
        offset:
          type: integer
          format: int64
          minimum: 0
          default: 0
        limit:
          type: integer
          format: int64
          default: 65536
          minimum: 1
          maximum: 4194304
          description: Read chunk bytes; the backend clamps to this interval.
      required:
      - path
      additionalProperties: false
    FileListArgs:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
        depth:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
      required:
      - path
      additionalProperties: false
    FileSearchArgs:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Search root inside the runtime filesystem; at most 4096 UTF-8 bytes.
        pattern:
          type: string
          maxLength: 1024
          default: '*'
          description: Case-sensitive basename or full-path glob; at most 1024 UTF-8 bytes. '*' also matches separators.
        exclude_patterns:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 1024
            description: Exclusion glob of at most 1024 UTF-8 bytes.
          default: []
          description: Filters matching entries without pruning directory traversal.
        depth:
          type: integer
          minimum: 1
          maximum: 64
          default: 64
        max_results:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
        max_entries:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 30000
          default: 10000
      required:
      - path
      additionalProperties: false
      description: Missing roots and non-directory roots return no matches. Nested symlink directories are not followed.
    FileRenameArgs:
      type: object
      properties:
        old_path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
        new_path:
          type: string
          minLength: 1
          description: Path inside the runtime filesystem.
      required:
      - old_path
      - new_path
      additionalProperties: false
    ShellCreateArgs:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
        shell:
          type: string
          default: /bin/bash
      required:
      - session_id
      additionalProperties: false
      description: Creates a persistent PTY shell. Apply cwd/env through shell.run commands; these are not shell.create
        parameters.
    ShellIdentityArgs:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
      required:
      - session_id
      additionalProperties: false
    ShellRunArgs:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
        command:
          type: string
        timeout:
          type: number
          minimum: 0
          description: SDK compatibility argument; the backend does not enforce this timeout. The SDK bounds its
            polling wait.
      required:
      - session_id
      - command
      additionalProperties: false
      description: Submits asynchronously. Poll for completion; cwd/env are applied in the command string. The backend
        ignores timeout.
    ShellPollArgs:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
        wait_timeout:
          type: number
          minimum: 0
          description: Compatibility argument; the current backend returns its immediately available snapshot and
            does not wait.
      required:
      - session_id
      additionalProperties: false
    ExecResult:
      type: object
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
          format: int64
        exit_signal:
          type:
          - integer
          - 'null'
          format: int64
      required:
      - stdout
      - stderr
      - exit_code
      additionalProperties: false
      description: Synchronous process.exec result, distinct from stable command records. Spawn/timeout failure
        uses exit_code=-1 and stderr; a signal alone is not OOM.
    CommandStarted:
      type: object
      properties:
        command_id:
          type: string
        pid:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - TIMED_OUT
          - KILLED
          - running
          - done
          - error
        error_code:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      required:
      - command_id
      - pid
      - status
      - error_code
      - error
      additionalProperties: false
    CommandRecord:
      type: object
      properties:
        command_id:
          type: string
        pid:
          type: integer
          format: int64
        cmd:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - TIMED_OUT
          - KILLED
          - running
          - done
          - error
        running:
          type: boolean
        state_version:
          type: integer
          format: int64
          minimum: 0
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type:
          - integer
          - 'null'
          format: int64
        exit_signal:
          type:
          - integer
          - 'null'
          format: int64
        created_at_ms:
          type: integer
          format: int64
        started_at_ms:
          type:
          - integer
          - 'null'
          format: int64
        finished_at_ms:
          type:
          - integer
          - 'null'
          format: int64
        stdout_truncated:
          type: boolean
        stderr_truncated:
          type: boolean
        truncated:
          type: boolean
        stdout_total_bytes:
          type: integer
          format: int64
        stdout_retained_bytes:
          type: integer
          format: int64
        stderr_total_bytes:
          type: integer
          format: int64
        stderr_retained_bytes:
          type: integer
          format: int64
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      required:
      - command_id
      - pid
      - cmd
      - status
      - running
      - state_version
      - stdout
      - stderr
      - exit_code
      - exit_signal
      additionalProperties: false
      description: Stable command records use uppercase status; PID-only lookup uses running/done/error. Spawn failure
        is FAILED/SPAWN_FAILED with null exit_code and an error_message. Terminal output may be truncated; byte
        counters describe the retained suffix.
    CommandWaitTimeout:
      type: object
      properties:
        status:
          type: string
          const: running
        error_code:
          type: string
          const: WAIT_TIMEOUT
        error_message:
          type: string
        error:
          type: 'null'
      required:
      - status
      - error_code
      - error_message
      - error
