openapi: "3.1.0"
info:
  title: ADX Environment Management API
  version: "1.0.0"
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Public lifecycle API implemented by the Rust API Server and exposed through
    Ingress. Environment is the public API and SDK model as well as the logical execution
    identity used internally. Runtime represents a physical execution. The public
    environmentId field maps to environment_id at the API Server boundary.
    Lifecycle responses use an envelope whose `data` member is base64-encoded
    JSON. Resource discovery returns its typed JSON document directly. Create
    can return Server-Sent Events when requested by the client.
servers:
  - url: https://{address}
    variables:
      address:
        default: adx.example.com
security:
  - bearerAuth: []
  - xAuth: []
tags:
  - name: Environments
    description: Public Environment lifecycle and current execution view.
  - name: Resources
    description: Current online node capacity and admission status exposed to the Environment SDK.
  - name: Scheduler compatibility
    description: Administrator compatibility surface for established scheduler operations.
  - name: API Keys
    description: Administrator-only tenant key creation, listing and revocation.
  - name: Snapshots
    description: Tenant-scoped reusable checkpoint catalog.
paths:
  /api/admin/v1/keys:
    post:
      tags:
      - API Keys
      operationId: createTenantKey
      summary: Create a tenant API Key (administrator only)
      description: Returns plaintext apiKey once. The key id is a SHA256 identifier and cannot authenticate requests.
        Expiry zero or omitted means no expiry; a positive expiry must be in the future. Caller tenant headers cannot
        elevate privileges.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantKeyRequest'
      responses:
        '201':
          description: Metadata and the one-time plaintext key; no lifecycle envelope.
          headers:
            Cache-Control:
              description: Key responses must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTenantKey'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - API Keys
      operationId: listTenantKeys
      summary: List tenant key metadata (administrator only)
      description: Never returns plaintext keys. Use id for revocation and the original apiKey for SDK authentication.
      parameters:
      - name: tenantId
        in: query
        schema:
          type: string
        description: Optional tenant filter; omitted or empty selects all tenants.
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: pageToken
        in: query
        schema:
          type: string
        description: Opaque cursor from nextPageToken.
      responses:
        '200':
          description: Paginated metadata; no lifecycle envelope.
          headers:
            Cache-Control:
              description: Key responses must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantKeyList'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/admin/v1/keys/{id}:
    delete:
      tags:
      - API Keys
      operationId: revokeTenantKey
      summary: Revoke a tenant API Key (administrator only)
      description: Idempotent revocation; already revoked or absent returns 204. Authentication-cache propagation
        follows the configured cache lifetime.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        description: Key identifier, not the plaintext apiKey.
      responses:
        '204':
          description: Revoked; empty response body.
          headers:
            Cache-Control:
              description: Key responses must not be cached.
              schema:
                type: string
                const: no-store
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/environment/v1/capabilities:
    get:
      tags: [Environments]
      operationId: getEnvironmentCapabilities
      summary: Query supported environment management capabilities
      responses:
        "200":
          description: Authenticated capability document without an envelope.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: {type: string}
              example: {capabilities: [workload-probes-v1]}
        default: {$ref: "#/components/responses/Error"}
  /global-scheduler/resources:
    get:
      tags: [Scheduler compatibility]
      operationId: listLegacySchedulerResources
      summary: List online node resources using the legacy-compatible path
      description: |
        Capacity and allocatable totals include only online nodes accepting
        new allocations. Online nodes with admission disabled remain in
        resource.fragment with status 1, zero CPU/Memory/Disk capacity and
        allocatable values, and no GPU/NPU resource entries. This is a scheduling
        view; disabling admission does not release existing allocations or
        erase the Coordinator's underlying capacity and allocation ledger.
      responses:
        "200":
          description: Current node capacity, allocatable resources and admission status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegacyResourceResponse"}
        default: {$ref: "#/components/responses/Error"}
  /global-scheduler/scheduling_queue:
    get:
      tags: [Scheduler compatibility]
      operationId: listLegacySchedulingQueue
      summary: List requests waiting in the in-memory ShardScheduler queues
      description: Administrator only. Assigned Environments are not included.
      responses:
        "200":
          description: Bounded waiting-request view.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchedulingQueue"}
        default: {$ref: "#/components/responses/Error"}
  /global-scheduler/node/localschedulingstatus:
    parameters:
      - name: node_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
    post:
      tags: [Scheduler compatibility]
      operationId: pauseNodeScheduling
      summary: Stop new scheduling to one node
      description: Administrator only. Existing Environments continue running.
      responses:
        "200":
          description: Node admission is administratively paused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeSchedulingStatus"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Scheduler compatibility]
      operationId: resumeNodeScheduling
      summary: Remove the administrative scheduling pause from one node
      description: Administrator only. Local pressure and reconciliation can still keep admission closed.
      responses:
        "200":
          description: Administrative pause is removed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeSchedulingStatus"}
        default: {$ref: "#/components/responses/Error"}
  /api/environment/v1/resources:
    get:
      tags: [Resources]
      operationId: listEnvironmentResources
      summary: List current online node resources and admission status
      description: |
        Returns the API Server's fresh in-memory node directory, including
        online nodes whose new-allocation admission is paused. The directory
        is initialized by a complete Coordinator watch frame and then refreshed by
        subsequent frames; an expired or unavailable view returns an error
        instead of stale capacity. CPU is reported in millicores and Memory and
        Disk in MiB. Nodes with admission disabled retain their identity,
        labels and status 1, but report zero CPU/Memory/Disk capacity and
        allocatable values and no GPU/NPU resource entries. This is a scheduling
        view, not rated physical capacity or actual utilization. Existing
        allocations and the Coordinator's underlying resource ledger are retained.
      responses:
        "200":
          description: Current node capacity, allocatable resources and admission status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResourceList"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/environments:
    post:
      tags: [Environments]
      operationId: createEnvironment
      summary: Create a Environment
      description: |
        `X-Request-Id` identifies one logical create. A retry must retain both
        that ID and the same request body. With `Accept: text/event-stream`, an
        `accepted` event is followed by heartbeats and one authoritative `final`
        event.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum: [application/json, text/event-stream]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "200":
          description: Created, or an SSE stream whose final event reports the outcome.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/CreateEnvironmentEnvelopeData"
            text/event-stream:
              schema:
                type: string
              example: |-
                event: accepted
                data: {"status":"creating","requestId":"create-01"}

                event: final
                data: {"status":"running","environmentId":"demo","requestId":"create-01"}
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/instances:
    get:
      tags: [Environments]
      operationId: listEnvironments
      summary: List caller-visible Environments, or inspect one by ID
      description: Returns the synchronized in-memory directory. Without instance_id, returns a bounded page of caller-visible instances; administrators can see every tenant. Every view includes tenant_id from the owning record. With instance_id, returns the matching view in an array. Tombstones are omitted.
      parameters:
        - name: instance_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
          description: Page size for list queries without instance_id.
        - name: pageToken
          in: query
          schema: {type: string}
          description: Opaque cursor from the previous page, bound to the caller scope.
      responses:
        "200":
          description: Paged Environment views, or a one-element array with instance_id.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/InstanceView"
                  - type: object
                    required: [items, nextPageToken]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/InstanceView"
                      nextPageToken:
                        type: string
                        description: Empty on the last page.
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/environments/{environmentId}:
    delete:
      tags: [Environments]
      operationId: deleteEnvironment
      summary: Delete a Environment
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Delete result in the standard envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/environments/{environmentId}/pause:
    post:
      tags: [Environments]
      operationId: pauseEnvironment
      summary: Pause a Environment and publish its restore point
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/PauseOperationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseRequest"
      responses:
        "200":
          description: >-
            Restore point metadata is committed. With local storage the complete
            artifact is readable on its owning node, without an adxlet fsync
            barrier or a host-crash durability guarantee. With object storage,
            artifact upload is complete before success is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/PauseEnvelopeData"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/environments/{environmentId}/resume:
    post:
      tags: [Environments]
      operationId: resumeEnvironment
      summary: Resume a paused Environment
      description: |
        Manual resume accepts both manually and idle-automatically paused Environments.
        Authorized business traffic also resumes either kind through the same
        Coordinator entry without an auto-resume switch. Concurrent manual and
        traffic-triggered demands share one durable restore intent. A valid,
        unexpired checkpoint is required; local-only points require the owning node.
        Health, metrics and passive subscriptions do not trigger resume.
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/ResumeOperationId"
      responses:
        "200":
          description: The Environment Environment is running and its local Runtime route is bound.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/ResumeEnvelopeData"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/environments/{environmentId}/reload:
    post:
      tags: [Environments]
      operationId: reloadEnvironment
      summary: Replace a running execution from its latest retained restore point
      description: |
        The logical Environment ID, node ownership and generation stay unchanged.
        No image fallback occurs when the restore point is missing or unusable.
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/ReloadOperationId"
      responses:
        "200":
          description: The replacement execution is ready, routed and committed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/SuccessEnvelopeData"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/environments/{environmentId}/network:
    put:
      tags: [Environments]
      operationId: updateEnvironmentNetworkPolicy
      summary: Atomically replace the complete runtime network policy
      description: An empty object clears the policy. The committed Environment specification changes only after sandboxd accepts the replacement Runtime.
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/NetworkOperationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/NetworkPolicy"
                - type: object
                  maxProperties: 0
      responses:
        "200":
          description: Policy replacement is applied and committed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/SuccessEnvelopeData"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/environments/{environmentId}/snapshots:
    post:
      tags: [Snapshots]
      operationId: createSnapshot
      summary: Create a reusable snapshot and resume the source Environment
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/SnapshotOperationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequest"
      responses:
        "200":
          description: Snapshot and resumed source state are committed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/CreateSnapshotEnvelopeData"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/snapshots:
    get:
      tags: [Snapshots]
      operationId: listSnapshots
      summary: List reusable snapshots for the authenticated tenant
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: pageToken
          in: query
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Tenant-scoped snapshot catalog page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/SnapshotListEnvelopeData"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/environment/v1/snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      tags: [Snapshots]
      operationId: getSnapshot
      summary: Get a reusable snapshot
      responses:
        "200":
          description: Tenant-scoped snapshot catalog record.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/SnapshotEnvelopeData"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Snapshots]
      operationId: deleteSnapshot
      summary: Mark a reusable snapshot for deletion
      description: New references are rejected; bytes are removed after existing references are released.
      parameters:
        - $ref: "#/components/parameters/SnapshotDeleteOperationId"
      responses:
        "200":
          description: Current catalog state in the standard envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Tenant or administrator API Key.
    xAuth:
      type: apiKey
      in: header
      name: X-Auth
      description: Compatibility API Key header.
  headers:
    RequestId:
      description: Logical request identity echoed by API Server.
      schema:
        type: string
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: API Server generates and echoes an ID when this header is omitted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PauseOperationId:
      name: X-ADX-Request-ID
      in: header
      required: true
      schema:
        type: string
        pattern: "^pause-[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    ResumeOperationId:
      name: X-ADX-Request-ID
      in: header
      required: true
      schema:
        type: string
        pattern: "^resume-[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    ReloadOperationId:
      name: X-ADX-Request-ID
      in: header
      required: true
      schema:
        type: string
        pattern: "^reload-[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    NetworkOperationId:
      name: X-ADX-Request-ID
      in: header
      required: true
      schema:
        type: string
        pattern: "^network-[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    SnapshotOperationId:
      name: X-ADX-Request-ID
      in: header
      required: true
      schema:
        type: string
        pattern: "^snapshot-[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    SnapshotDeleteOperationId:
      name: X-ADX-Request-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Error:
      description: Stable ADX error envelope; retry behavior comes from `error.retry` and `error.outcome`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    NodeResourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/NodeResource"}
    NodeResource:
      type: object
      description: Online node scheduling resources; capacity and allocatable are zero when status is 1.
      additionalProperties: false
      required: [id, status, capacity, allocatable, labels]
      properties:
        id: {type: string, minLength: 1}
        status:
          type: integer
          format: int32
          description: Legacy UnitStatus compatibility value; 0 is normal and 1 is evicting/not accepting new allocations.
        capacity: {$ref: "#/components/schemas/NodeScalarResources"}
        allocatable: {$ref: "#/components/schemas/NodeScalarResources"}
        labels:
          type: object
          additionalProperties: {type: string}
    NodeScalarResources:
      type: object
      additionalProperties: {type: number, minimum: 0}
      required: [CPU, Memory, Disk]
      properties:
        CPU: {type: number, minimum: 0, description: CPU millicores}
        Memory: {type: number, minimum: 0, description: Memory MiB}
        Disk: {type: number, minimum: 0, description: Disk MiB}
    NodeSchedulingStatus:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status: {type: string, enum: [normal, evicting]}
        message: {type: string}
    LegacyResourceResponse:
      type: object
      description: Scheduling resource totals and online node fragments; admission-disabled nodes contribute no resources to the totals.
      additionalProperties: false
      required: [requestID, resource]
      properties:
        requestID: {type: string}
        resource: {$ref: "#/components/schemas/LegacyResourceUnit"}
    LegacyResourceUnit:
      type: object
      required: [id, capacity, allocatable, status]
      properties:
        id: {type: string}
        capacity: {$ref: "#/components/schemas/LegacyResources"}
        allocatable: {$ref: "#/components/schemas/LegacyResources"}
        status: {type: integer, description: 0 is normal and 1 is evicting.}
        fragment:
          type: object
          additionalProperties: {$ref: "#/components/schemas/LegacyResourceUnit"}
        nodeLabels:
          type: object
          additionalProperties:
            type: object
            required: [items]
            properties:
              items:
                type: object
                additionalProperties: {type: integer}
    LegacyResources:
      type: object
      additionalProperties: false
      required: [resources]
      properties:
        resources:
          type: object
          additionalProperties:
            type: object
            properties:
              scalar:
                type: object
                required: [value]
                properties:
                  value: {type: number, minimum: 0}
              vectors:
                type: object
                description: Legacy-compatible whole-card count vector for GPU/NPU resources.
    SchedulingQueue:
      type: object
      additionalProperties: false
      required: [count, instanceInfos]
      properties:
        count: {type: integer, minimum: 0}
        instanceInfos:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [instanceID, requestID, resources, enqueueTimeMs, waitDurationMs, schedulingRequirements]
            properties:
              instanceID: {type: string}
              requestID: {type: string, description: Same stable Environment ID because ADX has no second scheduling-request identity.}
              resources:
                type: object
                additionalProperties: {oneOf: [{type: string}, {type: number}]}
              enqueueTimeMs: {type: string, pattern: "^[0-9]+$"}
              waitDurationMs: {type: string, pattern: "^[0-9]+$"}
              schedulingRequirements:
                type: object
                additionalProperties: false
                required: [runtimeClass]
                properties:
                  runtimeClass:
                    type: string
                    minLength: 1
                    description: Resolved runtime required by this queued Environment; a node must report this value in its supported runtime classes.
    CreateEnvironmentRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        namespace: {type: string, default: default}
        image:
          type: string
          description: Required unless snapshotId or the deployment Runtime Environment supplies the rootfs.
        runtime: {type: string}
        user:
          type: string
          minLength: 1
          maxLength: 256
          description: Tool runtime POSIX name or decimal UID. Requires group. Currently supported by Conch; other runtimes reject. Cannot combine with inheritEntrypoint or snapshotId.
        group:
          type: string
          minLength: 1
          maxLength: 256
          description: Tool runtime POSIX name or decimal GID, paired with user. Shared mounts must already grant this identity access; existing ownership is not changed.
        cwd:
          type: string
          pattern: "^/"
          description: |
            Constructor command directory. Execd creates it and any missing
            parents before runtime Ready; failure prevents a successful create.
            It does not change Execd or the inherited image entrypoint cwd.
            A commands.run cwd override still requires an existing directory.
        rootfs:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Rootfs"
        cpu:
          type: integer
          format: int64
          minimum: 0
          default: 1000
          description: CPU request in millicores.
        cpu_limit:
          type: integer
          format: int64
          minimum: 0
          description: Execution cgroup CPU limit in millicores; zero inherits `cpu`.
        memory:
          type: integer
          format: int64
          minimum: 0
          default: 2048
          description: Memory request in MiB.
        mem_limit:
          type: integer
          format: int64
          minimum: 0
          description: Execution cgroup memory limit in MiB; zero inherits `memory`.
        storageMb: {type: integer, format: int64, minimum: 1}
        storage_limit_mb:
          type: integer
          format: int64
          minimum: 0
          description: Writable-layer limit in MiB; zero inherits `storageMb`.
        env:
          type: object
          additionalProperties: {type: string}
        labels:
          type: object
          additionalProperties: {type: string}
        ports:
          type: array
          uniqueItems: true
          description: |
            User ports declared by the SDK. Ingress authorizes the tenant and
            Environment on every forwarded request; Relay then connects to
            the declared port on its current Runtime.
          items:
            type: string
            pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
        snapshotId:
          type: string
          description: Tenant-scoped reusable snapshot used to create a new Environment.
        idleTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Idle observation window; zero disables the action. Not a maximum lifetime.
        idleAction:
          type: string
          enum: [delete, pause]
          default: delete
          description: |
            Pause requires positive idleTimeoutSeconds and checkpoint capability.
            Idle pause produces the same Paused state as manual pause and remains
            eligible for manual resume or authorized traffic-triggered resume.
        pauseOptions: {$ref: "#/components/schemas/PausePolicy"}
        restartPolicy: {$ref: "#/components/schemas/RestartPolicy"}
        failover:
          type: boolean
          default: false
          description: Recover an unexpectedly exited execution from its latest retained restore point on the owning node; never cold-starts when the point is absent.
        inheritEntrypoint:
          type: boolean
          default: false
          description: Run the effective OCI image Entrypoint and Cmd as the EXECD-managed workload. Image rootfs only.
        process: {$ref: "#/components/schemas/WorkloadProcess"}
        readinessProbe: {$ref: "#/components/schemas/ReadinessProbe"}
        healthcheckProbe: {$ref: "#/components/schemas/HealthcheckProbe"}
        mounts:
          type: array
          items: {$ref: "#/components/schemas/Mount"}
        network: {$ref: "#/components/schemas/NetworkPolicy"}
        dataPlane: {$ref: "#/components/schemas/DataPlanePolicy"}
        extra_config:
          type: object
          additionalProperties: true
          description: Serialized to sandboxd's runtime-specific extra_config field.
        scheduleAffinities:
          type: array
          maxItems: 256
          items: {$ref: "#/components/schemas/ScheduleAffinity"}
        createTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          default: 90
          description: End-to-end create budget.
        scheduleTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          default: 30
          description: Applies only after admission to the central scheduling queue.
        initCallTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
          default: 30
          description: Execd initialization and readiness budget after backend preparation, also bounded by the total create deadline. Zero uses the default.
        xpu:
          type: string
          description: GPU/NPU whole-device request encoded by the compatibility API.
        tunnel: {$ref: "#/components/schemas/TunnelRequest"}
    WorkloadProcess:
      type: object
      additionalProperties: false
      description: Optional image workload overrides. Requires inheritEntrypoint=true. Omitted fields inherit the image defaults; multiple commands start concurrently and a failing command terminates its siblings.
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: array
            minItems: 1
            maxItems: 256
            items: {type: string}
        user:
          type: string
          minLength: 1
          maxLength: 256
          description: Image user name or numeric UID, optionally followed by a group.
        cwd:
          type: string
          pattern: "^/"
          description: Existing accessible canonical absolute workload directory; distinct from constructor cwd.
    ProbeActions:
      type: object
      properties:
        httpGet:
          type: object
          additionalProperties: false
          required: [port]
          properties:
            port: {type: integer, minimum: 1, maximum: 65535}
            path: {type: string, default: "/", pattern: "^/", maxLength: 2048}
        tcpSocket:
          type: object
          additionalProperties: false
          required: [port]
          properties:
            port: {type: integer, minimum: 1, maximum: 65535}
        exec:
          type: object
          additionalProperties: false
          required: [command]
          properties:
            command:
              type: array
              minItems: 1
              maxItems: 256
              items: {type: string}
      oneOf:
        - required: [httpGet]
        - required: [tcpSocket]
        - required: [exec]
    ReadinessProbe:
      allOf:
        - {$ref: "#/components/schemas/ProbeActions"}
        - type: object
          properties:
            initialDelaySeconds: {type: integer, minimum: 0, maximum: 86400, default: 0}
            periodSeconds: {type: integer, minimum: 1, maximum: 86400, default: 2}
            timeoutSeconds: {type: integer, minimum: 1, maximum: 3600, default: 1}
      unevaluatedProperties: false
      description: One-time Execd startup gate, retried until initCallTimeoutSeconds. Requires inheritEntrypoint.
    HealthcheckProbe:
      allOf:
        - {$ref: "#/components/schemas/ProbeActions"}
        - type: object
          properties:
            initialDelaySeconds: {type: integer, minimum: 0, maximum: 86400, default: 0}
            periodSeconds: {type: integer, minimum: 1, maximum: 86400, default: 10}
            timeoutSeconds: {type: integer, minimum: 1, maximum: 3600, default: 2}
            failureThreshold: {type: integer, minimum: 1, maximum: 4294967295, default: 3}
      unevaluatedProperties: false
      description: Periodic check after readiness. Consecutive failures trigger the existing Adxlet lifecycle policy.
    ProbeFailure:
      type: object
      required: [kind, message, consecutive_failures]
      properties:
        kind: {type: string, enum: [readiness_timeout, healthcheck_failed]}
        message: {type: string}
        consecutive_failures: {type: integer, minimum: 0}
        exit_code: {type: integer}
        http_status: {type: integer, minimum: 100, maximum: 599}
    Rootfs:
      type: object
      additionalProperties: false
      properties:
        runtime: {type: string}
        type: {type: string, enum: [image, s3]}
        imageurl: {type: string}
        readonly:
          type: boolean
          description: Optional override; omitted inherits the deployment Runtime Environment default.
        storageInfo: {$ref: "#/components/schemas/S3Source"}
    S3Source:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, object]
      properties:
        endpoint: {type: string, minLength: 1}
        bucket: {type: string, minLength: 1}
        object: {type: string, minLength: 1}
        accessKey: {type: string}
        secretKey: {type: string}
    Mount:
      type: object
      additionalProperties: false
      required: [type, target]
      properties:
        type: {type: string, enum: [bind, erofs, tmpfs]}
        target: {type: string, pattern: "^/"}
        options: {type: array, items: {type: string, minLength: 1}}
        image_url: {type: string}
        s3_config: {$ref: "#/components/schemas/S3Source"}
    DataPlanePolicy:
      type: object
      additionalProperties: false
      properties:
        tunnelSecurityMode: {type: string, enum: [tls, tls-token]}
        portForwardSecurityMode: {type: string, enum: [tls, tls-token]}
    NetworkPolicy:
      type: object
      additionalProperties: false
      properties:
        blockNetwork: {type: boolean}
        dnsBlacklist: {type: array, items: {type: string, minLength: 1}}
        schemaVersion: {type: integer, const: 2}
        traffic: {$ref: "#/components/schemas/TrafficPolicy"}
        dns: {$ref: "#/components/schemas/DnsPolicy"}
    TrafficPolicy:
      type: object
      additionalProperties: false
      required: [ingressDefaultAction, egressDefaultAction, mode]
      properties:
        ingressDefaultAction: {type: string, enum: [allow, deny]}
        egressDefaultAction: {type: string, enum: [allow, deny]}
        mode: {type: string, enum: [stateless, stateful]}
        rules: {type: array, items: {$ref: "#/components/schemas/NetworkRule"}}
    NetworkRule:
      type: object
      additionalProperties: false
      required: [action, direction, protocol]
      properties:
        action: {type: string, enum: [allow, deny]}
        direction: {type: string, enum: [ingress, egress, both]}
        protocol: {type: string, enum: [any, tcp, udp, icmp]}
        peer: {$ref: "#/components/schemas/NetworkPeer"}
        environmentPort: {type: integer, minimum: 0, maximum: 65535}
        environmentPortRange: {$ref: "#/components/schemas/PortRange"}
        priority:
          type: integer
          minimum: 1
          maximum: 4294967294
          description: UINT32_MAX is reserved for ADX control-plane rules.
    NetworkPeer:
      type: object
      additionalProperties: false
      properties:
        address: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        cidr: {type: string}
        domain: {type: string}
        portRange: {$ref: "#/components/schemas/PortRange"}
    PortRange:
      type: object
      additionalProperties: false
      required: [first, last]
      properties:
        first: {type: integer, minimum: 1, maximum: 65535}
        last: {type: integer, minimum: 1, maximum: 65535}
    DnsPolicy:
      type: object
      additionalProperties: false
      required: [defaultAction]
      properties:
        defaultAction: {type: string, enum: [allow, deny]}
        rules: {type: array, items: {$ref: "#/components/schemas/DnsRule"}}
    DnsRule:
      type: object
      additionalProperties: false
      required: [action, pattern]
      properties:
        action: {type: string, enum: [allow, deny]}
        pattern: {type: string, minLength: 1}
    RestartPolicy:
      type: object
      additionalProperties: false
      required: [maxAttempts, initialBackoffSeconds, maxBackoffSeconds]
      properties:
        maxAttempts: {type: integer, minimum: 0}
        initialBackoffSeconds: {type: integer, format: int64, minimum: 0}
        maxBackoffSeconds: {type: integer, format: int64, minimum: 0}
    ScheduleAffinity:
      type: object
      additionalProperties: false
      required: [labelOps]
      properties:
        kind:
          type: integer
          enum: [0, 1]
          default: 0
          description: "0 selects nodes; 1 selects existing Environments. Runtime selection uses the create runtime field."
        affinity:
          type: integer
          enum: [0, 1, 2, 3]
          default: 0
          description: "0 preferred affinity; 1 preferred anti-affinity; 2 required affinity; 3 required anti-affinity."
        weight:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Zero is normalized to weight 1.
        preferredPriority:
          type: boolean
          default: false
          description: Ordered preference terms; ordering must be consistent within the same placement group.
        preferredAntiOtherLabels:
          type: boolean
          const: false
          default: false
          description: True is unsupported and returns UNIMPLEMENTED.
        labelOps:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [labelKey]
            properties:
              type:
                type: integer
                enum: [0, 1, 2, 3]
                default: 0
                description: "0 In; 1 NotIn (also requires the label to exist); 2 Exists; 3 DoesNotExist."
              labelKey: {type: string, minLength: 1}
              labelValues:
                type: array
                items: {type: string}
            allOf:
              - if:
                  properties:
                    type: {enum: [2, 3]}
                  required: [type]
                then: {}
                else:
                  required: [labelValues]
                  properties:
                    labelValues: {minItems: 1}
    TunnelRequest:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean, default: false}
        proxyPort: {type: integer, minimum: 1, maximum: 65535}
    CreateEnvironmentResult:
      type: object
      required: [environmentId, status, requestId]
      properties:
        environmentId: {type: string}
        status: {type: string, const: running}
        requestId: {type: string}
        tunnel: {type: object, additionalProperties: true}
    InstanceView:
      type: object
      required: [id, tenant_id, status, required_cpu, required_mem, image]
      properties:
        id: {type: string}
        tenant_id: {type: string, description: Owning tenant from the Environment record}
        status: {type: string}
        required_cpu: {type: integer, format: int64, description: CPU millicores}
        required_mem: {type: integer, format: int64, description: Memory MiB}
        image: {type: string}
        failure:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/EnvironmentFailure"
    EnvironmentFailure:
      type: object
      additionalProperties: false
      required: [reason, exit_code, message]
      properties:
        reason: {type: string, enum: [OomKilled, Exited, Missing, ProbeFailed, DeadlineExceeded]}
        exit_code: {type: [integer, "null"], format: int32}
        message: {type: string}
        probe_failure: {$ref: "#/components/schemas/ProbeFailure"}
    RetentionPolicy:
      description: Finite retention starts after publication; forever retains the point until deletion or replacement.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, ttlSeconds]
          properties:
            kind: {type: string, const: ttl}
            ttlSeconds: {type: integer, format: int64, minimum: 1}
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, const: forever}
    PausePolicy:
      type: object
      additionalProperties: false
      properties:
        retention:
          allOf: [{$ref: "#/components/schemas/RetentionPolicy"}]
          default: {kind: ttl, ttlSeconds: 90000}
        timeoutSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 300
          description: Sandboxd checkpoint capture budget; does not bound OBS publication or the whole pause operation.
        storage:
          type: string
          enum: [configured, local, shared]
          default: configured
          description: Anonymous checkpoint publication policy. Shared requires complete object-store publication and supports compatible cross-node resume.
    PauseRequest:
      type: object
      additionalProperties: false
      properties:
        retention:
          allOf: [{$ref: "#/components/schemas/RetentionPolicy"}]
          description: Omission inherits pauseOptions.retention, otherwise defaults to a 90000-second TTL.
        timeoutSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 300
          description: Capture RPC budget and per-attempt caller wait with transport allowance; not a total pause deadline.
    PauseResult:
      type: object
      required: [environmentId, snapshotId, size, state, expiresAt]
      properties:
        environmentId: {type: string}
        snapshotId: {type: string}
        size: {type: integer, format: int64, minimum: 1}
        state: {type: string, const: paused}
        expiresAt: {type: [integer, "null"], format: int64, description: "Null for permanent retention; otherwise a Unix timestamp in seconds."}
    ResumeResult:
      type: object
      required: [environmentId, state, routeAddress, functionProxyId, nodeId, portMappings]
      properties:
        environmentId: {type: string}
        state: {type: string, const: running}
        routeAddress: {type: string}
        functionProxyId:
          type: string
          description: Compatibility field containing Node ID; there is no FunctionProxy process.
        nodeId: {type: string}
        portMappings: {type: object, additionalProperties: true}
    SuccessResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success: {type: boolean, const: true}
    CreateSnapshotRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        timeoutSeconds: {type: integer, format: int64, minimum: 1, maximum: 3600, default: 300}
    CreateSnapshotResult:
      type: object
      required: [snapshotId, names]
      properties:
        snapshotId: {type: string}
        names:
          type: array
          items: {type: string}
    Snapshot:
      type: object
      additionalProperties: false
      required: [snapshotId, names]
      properties:
        snapshotId: {type: string}
        names:
          type: array
          items: {type: string}
    SnapshotList:
      type: object
      additionalProperties: false
      required: [items, nextPageToken]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Snapshot"}
        nextPageToken: {type: string}
    CreateEnvironmentEnvelopeData:
      $ref: "#/components/schemas/EncodedCreateEnvironmentResult"
    PauseEnvelopeData:
      $ref: "#/components/schemas/EncodedPauseResult"
    ResumeEnvelopeData:
      $ref: "#/components/schemas/EncodedResumeResult"
    SuccessEnvelopeData:
      $ref: "#/components/schemas/EncodedSuccessResult"
    CreateSnapshotEnvelopeData:
      $ref: "#/components/schemas/EncodedCreateSnapshotResult"
    SnapshotListEnvelopeData:
      $ref: "#/components/schemas/EncodedSnapshotList"
    SnapshotEnvelopeData:
      $ref: "#/components/schemas/EncodedSnapshot"
    EncodedCreateEnvironmentResult:
      type: object
      properties:
        data:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema: {$ref: "#/components/schemas/CreateEnvironmentResult"}
    EncodedPauseResult:
      type: object
      properties:
        data:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema: {$ref: "#/components/schemas/PauseResult"}
    EncodedResumeResult:
      type: object
      properties:
        data:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema: {$ref: "#/components/schemas/ResumeResult"}
    EncodedSuccessResult:
      type: object
      properties:
        data:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema: {$ref: "#/components/schemas/SuccessResult"}
    EncodedCreateSnapshotResult:
      type: object
      properties:
        data:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema: {$ref: "#/components/schemas/CreateSnapshotResult"}
    EncodedSnapshotList:
      type: object
      properties:
        data:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema: {$ref: "#/components/schemas/SnapshotList"}
    EncodedSnapshot:
      type: object
      properties:
        data:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema: {$ref: "#/components/schemas/Snapshot"}
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, format: int32, example: 200}
        message: {type: string}
        data:
          oneOf:
            - type: string
              contentEncoding: base64
              description: Base64-encoded JSON operation result.
            - type: "null"
    ErrorEnvelope:
      type: object
      required: [code, message, error]
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          oneOf:
            - type: string
              contentEncoding: base64
            - type: "null"
        error: {$ref: "#/components/schemas/ErrorDetail"}
    ErrorDetail:
      type: object
      required: [code, retry, outcome, requestId]
      properties:
        code: {type: string, description: Stable symbolic ADX error code}
        retry: {type: string, enum: [never, same_operation, after_backoff]}
        outcome: {type: string, enum: [not_started, terminal, unknown]}
        requestId: {type: string}
        operationId: {type: string}
        environmentId: {type: string}

    CreateTenantKeyRequest:
      type: object
      properties:
        tenantId:
          type: string
          minLength: 1
        expiresAtUnixSeconds:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Unix seconds; 0 means no expiry.
      required:
      - tenantId
      additionalProperties: false
      examples:
      - tenantId: team-a
        expiresAtUnixSeconds: 0
    TenantKey:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        expiresAtUnixSeconds:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - tenantId
      - expiresAtUnixSeconds
      additionalProperties: false
    CreatedTenantKey:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/TenantKey'
        apiKey:
          type: string
          minLength: 32
          description: One-time plaintext credential. Store securely; list cannot recover it.
      required:
      - key
      - apiKey
      additionalProperties: false
    TenantKeyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantKey'
        nextPageToken:
          type: string
      required:
      - items
      - nextPageToken
      additionalProperties: false
      examples:
      - items:
        - id: example-key-id
          tenantId: team-a
          expiresAtUnixSeconds: 0
        nextPageToken: ''
