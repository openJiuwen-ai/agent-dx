syntax = "proto3";

package adx.control.v1;

// Versioned internal Capsule control. All callers authenticate with mTLS.
import public "capsule_types.proto";
import public "snapshot.proto";
import public "credentials.proto";
import public "routes.proto";

service MasterService {
  rpc WatchNodes(WatchNodesRequest) returns (stream NodeDirectory);
  rpc GetSchedulingQueue(GetSchedulingQueueRequest) returns (GetSchedulingQueueResponse);
  rpc SetNodeScheduling(SetNodeSchedulingRequest) returns (NodeSchedulingState);
  rpc PrepareCreate(LocalCapsuleCreateRequest) returns (PreparedCapsule);
  rpc ClaimCapsule(ClaimCapsuleRequest) returns (ClaimCapsuleResponse);
  rpc ForwardCreate(LocalCapsuleCreateRequest) returns (CapsuleResult);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc InspectNode(InspectNodeRequest) returns (InspectNodeResponse);
  rpc CreateCapsule(CreateCapsuleRequest) returns (CapsuleResult);
  rpc GetCapsule(GetCapsuleRequest) returns (GetCapsuleResponse);
  // Node-owned state decisions are persisted by Master. This does not transfer
  // ownership of the Capsule lifecycle to Master.
  rpc CommitCapsule(CommitCapsuleRequest) returns (CommitCapsuleResponse);
}

service NodeService {
  rpc CreateLocalCapsule(LocalCapsuleCreateRequest) returns (CapsuleResult);
  rpc RecoverCapsule(RecoverCapsuleRequest) returns (CapsuleResult);
  // Master verifies the process currently serving an already registered address
  // before accepting a pre-timeout process replacement. Available during reconciliation.
  rpc GetSession(GetNodeSessionRequest) returns (GetNodeSessionResponse);
  rpc CreateCapsule(StartAssignedCapsuleRequest) returns (CapsuleResult);
  rpc DeleteCapsule(DeleteCapsuleRequest) returns (CapsuleResult);
  rpc PauseCapsule(PauseCapsuleRequest) returns (CapsuleResult);
  rpc ResumeCapsule(ResumeCapsuleRequest) returns (CapsuleResult);
  rpc UpdateNetworkPolicy(UpdateNetworkPolicyRequest) returns (CapsuleResult);
  rpc ReloadCapsule(ReloadCapsuleRequest) returns (CapsuleResult);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc CollectSnapshot(CollectSnapshotRequest) returns (CollectSnapshotResponse);
}

message RecoverCapsuleRequest { CapsuleRecord record = 1; string node_session_id = 2; }

message GetNodeSessionRequest {}

message GetNodeSessionResponse { string node_id = 1; string session_id = 2; }

message RegisterNodeRequest {
  string node_id = 1;
  string node_address = 2;
  Resources capacity = 3;
  bool accepting_allocations = 4;
  map<string,string> labels = 5;
  repeated Device devices = 6;
  string proxy_address = 7;
  string session_id = 8; // Unique for one Node Manager process lifetime.
  uint64 heartbeat_sequence = 9;
  bool reconciling = 10;

}

message RegisterNodeResponse { uint32 shard_id = 1; uint64 master_epoch = 2; }

message CreateCapsuleRequest {
  CapsuleSpec spec = 1;
  CallerContext caller = 2;
  // Bounds only time waiting for a central scheduling assignment.
  uint64 schedule_timeout_seconds = 3;
  // Bounds the complete public create operation across local or central paths.
  uint64 create_timeout_seconds = 4;
}

message GetCapsuleRequest { string capsule_id = 1; CallerContext caller = 2; }

message GetCapsuleResponse { CapsuleRecord record = 1; string node_address = 2; string node_proxy_address = 3; }

message StartAssignedCapsuleRequest {
  ReusableSnapshot snapshot = 4;
  CapsuleSpec spec = 1;
  Assignment assignment = 2;
  string node_session_id = 3;
}

message DeleteCapsuleRequest { Assignment assignment = 1; CallerContext caller = 2; }

message CommitCapsuleRequest { CapsuleRecord record = 1; string node_session_id = 2; }

message CommitCapsuleResponse { CapsuleRecord record = 1; }

message InspectNodeRequest { string node_id = 1; string session_id = 2; }

message InspectNodeResponse { repeated CapsuleRecord records = 1; uint64 master_epoch = 2; repeated ReusableSnapshot snapshots = 3; repeated RestorePoint retained_checkpoints = 4; }

message PauseCapsuleRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; uint64 ttl_seconds = 5; uint64 timeout_seconds = 6; }

message ResumeCapsuleRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; }

message UpdateNetworkPolicyRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  // Absence clears the complete policy and restores unrestricted networking.
  NetworkPolicy network = 5;
}

message ReloadCapsuleRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
}



// Node-local entry discovery. Every frame is a complete, bounded-lifetime view.
message WatchNodesRequest {}
message NodeEndpoint {
  string node_id = 1;
  string address = 2;
  string session_id = 3;
  Resources capacity = 4;
  Resources allocatable = 5;
  map<string,string> labels = 6;
  bool accepting_allocations = 7;
  repeated Device capacity_devices = 8;
  repeated Device allocatable_devices = 9;
}
message NodeDirectory { uint64 epoch = 1; repeated NodeEndpoint nodes = 2; uint64 valid_for_millis = 3; }
message GetSchedulingQueueRequest {}
message PendingCapsule { CapsuleSpec spec = 1; uint64 enqueue_time_millis = 2; }
message GetSchedulingQueueResponse { repeated PendingCapsule capsules = 1; }
message SetNodeSchedulingRequest {
  string node_id = 1;
  bool accepting_allocations = 2;
  reserved 3;
}
message NodeSchedulingState { string node_id = 1; bool accepting_allocations = 2; }
message LocalCapsuleCreateRequest { CreateCapsuleRequest create = 1; string node_session_id = 2; }
message PreparedCapsule { CapsuleSpec spec = 1; ReusableSnapshot snapshot = 2; }
message ClaimCapsuleRequest { CapsuleSpec spec = 1; CallerContext caller = 2; string node_session_id = 3; repeated DeviceAllocation devices = 4; }
message ClaimCapsuleResponse {
  oneof outcome {
    StartAssignedCapsuleRequest owned = 1;
    GetCapsuleResponse existing = 2;
    bool fallback = 3; // Definitive no-write result; safe to release this attempt's hold.
  }
}
