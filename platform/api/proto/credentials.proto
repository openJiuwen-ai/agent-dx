syntax = "proto3";

package adx.control.v1;

import "instance_types.proto";

service AuthService { rpc VerifyApiKey(VerifyApiKeyRequest) returns (VerifyApiKeyResponse); }

message VerifyApiKeyRequest { string api_key = 1; }

message VerifyApiKeyResponse { CallerContext caller = 1; uint64 expires_at_unix_seconds = 2; }

service CredentialService {
  rpc CreateTenantKey(CreateTenantKeyRequest) returns (CreateTenantKeyResponse);
  rpc ListTenantKeys(ListTenantKeysRequest) returns (ListTenantKeysResponse);
  rpc RevokeTenantKey(RevokeTenantKeyRequest) returns (RevokeTenantKeyResponse);
}

message TenantKey {
  string id = 1;
  string tenant_id = 2;
  uint64 expires_at_unix_seconds = 3;
}

message CreateTenantKeyRequest { CallerContext caller = 1; string tenant_id = 2; uint64 expires_at_unix_seconds = 3; }

message CreateTenantKeyResponse { TenantKey key = 1; string api_key = 2; }

message ListTenantKeysRequest { CallerContext caller = 1; string tenant_id = 2; string page_token = 3; uint32 page_size = 4; }

message ListTenantKeysResponse { repeated TenantKey keys = 1; string next_page_token = 2; }

message RevokeTenantKeyRequest { CallerContext caller = 1; string id = 2; }

message RevokeTenantKeyResponse {}
