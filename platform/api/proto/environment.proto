syntax = "proto3";

package adx.control.v1;

// Versioned internal Environment control. All callers authenticate with mTLS.
import public "environment_types.proto";
import public "snapshot.proto";
import public "snapshot_preparation.proto";
import public "volume.proto";
import public "credentials.proto";
import public "routes.proto";

service CoordinatorService {
  rpc GetEnvironmentControl(GetEnvironmentControlRequest) returns (EnvironmentControlRecord);
  rpc BatchGetEnvironmentControl(BatchGetEnvironmentControlRequest) returns (BatchGetEnvironmentControlResponse);
  rpc UpdateEnvironmentControl(UpdateEnvironmentControlRequest) returns (EnvironmentControlRecord);
  rpc WatchNodes(WatchNodesRequest) returns (stream NodeDirectory);
  rpc GetSchedulingQueue(GetSchedulingQueueRequest) returns (GetSchedulingQueueResponse);
  rpc SetNodeScheduling(SetNodeSchedulingRequest) returns (NodeSchedulingState);
  rpc PrepareCreate(LocalEnvironmentCreateRequest) returns (PreparedEnvironment);
  // Local execution identity and resource reservation, held only in memory.
  rpc ReserveLocalEnvironment(ClaimEnvironmentRequest) returns (ClaimEnvironmentResponse);
  rpc ClaimEnvironment(ClaimEnvironmentRequest) returns (ClaimEnvironmentResponse);
  rpc ForwardCreate(LocalEnvironmentCreateRequest) returns (EnvironmentResult);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc InspectNode(InspectNodeRequest) returns (InspectNodeResponse);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (EnvironmentResult);
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  rpc EnsureRunning(EnsureRunningRequest) returns (GetEnvironmentResponse);
  // Retire a dormant Environment whose original execution ownership is invalidated.
  rpc RetireDormant(GetEnvironmentRequest) returns (EnvironmentResult);
  // Node-owned state decisions are persisted by Coordinator. This does not transfer
  // ownership of the Environment lifecycle to Coordinator.
  rpc CommitEnvironment(CommitEnvironmentRequest) returns (CommitEnvironmentResponse);
}

message GetEnvironmentControlRequest { string id = 1; CallerContext caller = 2; }
message BatchGetEnvironmentControlRequest { repeated string ids = 1; CallerContext caller = 2; }
message BatchGetEnvironmentControlResponse { repeated EnvironmentControlRecord records = 1; }
message UpdateEnvironmentControlRequest {
  string id = 1;
  CallerContext caller = 2;
  uint64 timeout_seconds = 3;
  bool extend_only = 4;
}
service NodeService {
  rpc GetEnvironmentControl(NodeGetEnvironmentControlRequest) returns (EnvironmentControlRecord);
  rpc BatchGetEnvironmentControl(NodeBatchGetEnvironmentControlRequest) returns (BatchGetEnvironmentControlResponse);
  rpc UpdateEnvironmentControl(NodeUpdateEnvironmentControlRequest) returns (EnvironmentControlRecord);
  // Coordinator-only maintenance fencing. Grants are scoped to one process session.
  rpc ApplyNodeUpgradeControl(NodeUpgradeControl) returns (NodeUpgradeInspection);
  rpc InspectNodeUpgrade(NodeUpgradeInspectRequest) returns (NodeUpgradeInspection);
  // Wake the ordinary authority comparison after a durable ownership transfer.
  // A reply acknowledges the wake only, not a change in Environment ownership.
  rpc WakeNodeReconciliation(WakeNodeReconciliationRequest) returns (WakeNodeReconciliationResponse);
  rpc CreateLocalEnvironment(LocalEnvironmentCreateRequest) returns (EnvironmentResult);
  rpc RecoverEnvironment(RecoverEnvironmentRequest) returns (EnvironmentResult);
  // Coordinator verifies the process currently serving an already registered address
  // before accepting a pre-timeout process replacement. Available during reconciliation.
  rpc GetSession(GetNodeSessionRequest) returns (GetNodeSessionResponse);
  rpc CreateEnvironment(StartAssignedEnvironmentRequest) returns (EnvironmentResult);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (EnvironmentResult);
  rpc PauseEnvironment(PauseEnvironmentRequest) returns (EnvironmentResult);
  rpc ResumeEnvironment(ResumeEnvironmentRequest) returns (EnvironmentResult);
  rpc EnsureEnvironmentRunning(EnsureEnvironmentRunningRequest) returns (EnvironmentResult);
  rpc UpdateNetworkPolicy(UpdateNetworkPolicyRequest) returns (EnvironmentResult);
  rpc ReloadEnvironment(ReloadEnvironmentRequest) returns (EnvironmentResult);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc CollectSnapshot(CollectSnapshotRequest) returns (CollectSnapshotResponse);
  rpc CollectCheckpointCleanup(CollectCheckpointCleanupRequest) returns (CollectCheckpointCleanupResponse);
}

message NodeGetEnvironmentControlRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string node_session_id = 3;
}
message NodeBatchGetEnvironmentControlRequest { repeated NodeGetEnvironmentControlRequest requests = 1; }
message NodeUpdateEnvironmentControlRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string node_session_id = 3;
  uint64 timeout_seconds = 4;
  bool extend_only = 5;
}
message RecoverEnvironmentRequest {
  EnvironmentRecord record = 1; string node_session_id = 2;
  // One-run duration from the durable resume intent; separate from the RPC budget.
  optional uint64 run_timeout_seconds = 3;
}
message EnsureRunningRequest {
  string environment_id = 1; CallerContext caller = 2; reserved 3;
  uint64 timeout_seconds = 4;
  // Observed execution before demand; callers coalesce onto a later Running result.
  string expected_runtime_id = 5;
  // Applied before the resumed execution starts its owner timer.
  optional uint64 run_timeout_seconds = 6;
}
message EnsureEnvironmentRunningRequest {
  Assignment assignment = 1; string operation_id = 2; string node_session_id = 3;
  optional uint64 run_timeout_seconds = 4;
}

message GetNodeSessionRequest {}

message GetNodeSessionResponse { string node_id = 1; string session_id = 2; }

message RegisterNodeRequest {
  string node_id = 1;
  string node_address = 2;
  Resources capacity = 3;
  bool accepting_allocations = 4;
  map<string,string> labels = 5;
  repeated Device devices = 6;
  string proxy_address = 7;
  string session_id = 8; // Unique for one Adxlet process lifetime.
  uint64 heartbeat_sequence = 9;
  bool reconciling = 10;
  repeated string runtime_classes = 11; // Available classes reported by the configured runtime adapters.
  // Complete current mount view. Omitted domains are unavailable on this session.
  map<string, StorageMount> storage_mounts = 12;
  // Stable non-secret identities of configured shared checkpoint backends.
  repeated string checkpoint_scopes = 13;
  // Structured node pressure snapshot; in-memory coordinator state only.
  NodePressureReport pressure = 14;
  // Node-level pressure disposal state; see NodePressureDisposition.
  // v1: never set by adxlet, never read by the coordinator.
  NodePressureDisposition pressure_disposition = 15;
}

// Node-local resource pressure snapshot from local hysteresis. The level is
// authoritative state; percent is the observation that derived it. The
// report is in-memory coordinator state only and is omitted while the node
// has no successful sample (unconfigured or never observed).
message NodePressureReport {
  NodePressureResource memory = 1;
  NodePressureResource disk = 2;
  // Unix seconds of the last successful sample. Omitted (field absent) when
  // zero: absent means "no trustworthy observation", never "observed at epoch".
  uint64 observed_at_unix_seconds = 3;
  // Consecutive failed samples since the last success.
  uint32 consecutive_failures = 4;
}
message NodePressureResource {
  NodePressureLevel level = 1;
  // Last successful observation, 0-100.
  uint32 percent = 2;
  // Unix seconds of the last level transition; 0 = never transitioned.
  uint64 last_transition_unix_seconds = 3;
}
enum NodePressureLevel { NODE_PRESSURE_LEVEL_NORMAL = 0; NODE_PRESSURE_LEVEL_HIGH = 1; }

// Disposition of node-local pressure disposal. LOCAL = the local pause loop
// is keeping up with pressure; RELOCATION = local disposal is exhausted and
// the node requests central evacuation (v2; the coordinator then uses the
// existing recovery path). v1 never sets this field (proto3 default NONE).
enum NodePressureDisposition {
  NODE_PRESSURE_DISPOSITION_NONE = 0;
  NODE_PRESSURE_DISPOSITION_LOCAL = 1;
  NODE_PRESSURE_DISPOSITION_RELOCATION = 2;
}

message StorageMount {
  string backend_id = 1;
  string root = 2;
}

// Planned departure is authenticated and fenced to this exact boot session.
message UnregisterNodeRequest { string node_id = 1; string session_id = 2; }
message UnregisterNodeResponse {}

message RegisterNodeResponse { uint32 shard_id = 1; uint64 coordinator_epoch = 2; NodeUpgradeControl upgrade_control = 3; }

message CreateEnvironmentRequest {
  EnvironmentSpec spec = 1;
  CallerContext caller = 2;
  // Bounds only time waiting for a central scheduling assignment.
  uint64 schedule_timeout_seconds = 3;
  // Bounds the complete public create operation across local or central paths.
  uint64 create_timeout_seconds = 4;
  // Fixed by the entrypoint; retries and every hop retain this deadline.
  uint64 create_deadline_unix_millis = 5;
  // Previously observed assignment for diagnostics; unconfirmed attempts may be reassigned.
  Assignment expected_assignment = 6;
  // Stable public operation identity, preserved on every hop and retry.
  string request_id = 7;
  reserved 8;
  reserved "user_metadata";
}

message GetEnvironmentRequest { string environment_id = 1; CallerContext caller = 2; }

message GetEnvironmentResponse {
  EnvironmentRecord record = 1;
  string node_address = 2;
  string relay_address = 3;
  reserved 4;
}

message StartAssignedEnvironmentRequest {
  // Preserve the creation identity in the node's CREATE response.
  string creation_request_id = 6;
  ReusableSnapshot snapshot = 4;
  EnvironmentSpec spec = 1;
  Assignment assignment = 2;
  string node_session_id = 3;
  uint64 create_deadline_unix_millis = 5;
}

message DeleteEnvironmentRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  // Coordinator GC only: the node rechecks Failed and revision in the serial lifecycle task.
  optional uint64 failed_revision = 3;
  string node_session_id = 4;
  reserved 5;
  // Coordinator-owned preparation cleanup: exact lifecycle revision, with session fencing.
  optional uint64 expected_revision = 6;
  reserved 7, 8;
}

message CommitEnvironmentRequest {
  EnvironmentRecord record = 1;
  string node_session_id = 2;
  repeated string stopped_runtime_ids = 3;
  // Deleted only. Stored atomically with catalog retirement, before physical GC.
  repeated CheckpointArtifact cleanup_artifacts = 4;
}

message CheckpointCleanup {
  Assignment assignment = 1;
  uint64 revision = 2;
  repeated CheckpointArtifact artifacts = 3;
}
message CollectCheckpointCleanupRequest {
  CheckpointCleanup cleanup = 1;
  string node_session_id = 2;
  bool delegated = 3;
}
message CollectCheckpointCleanupResponse {
  string environment_id = 1;
  uint64 generation = 2;
  uint64 revision = 3;
}

message CommitEnvironmentResponse { EnvironmentRecord record = 1; }

message InspectNodeRequest { string node_id = 1; string session_id = 2; }

message InspectNodeResponse { repeated EnvironmentRecord records = 1; uint64 coordinator_epoch = 2; repeated ReusableSnapshot snapshots = 3; repeated CheckpointArtifact retained_artifacts = 4; }

message PauseEnvironmentRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; reserved 5; uint64 timeout_seconds = 6; RetentionPolicy retention = 7; reserved 8; string node_session_id = 9; }

message ResumeEnvironmentRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; }

message UpdateNetworkPolicyRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  // Absence clears the complete policy and restores unrestricted networking.
  NetworkPolicy network = 5;
}

message ReloadEnvironmentRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
}



// Node-local entry discovery. Every frame is a complete, bounded-lifetime view.
message WatchNodesRequest {}
message NodeEndpoint {
  string node_id = 1;
  string address = 2;
  string session_id = 3;
  Resources capacity = 4;
  Resources allocatable = 5;
  map<string,string> labels = 6;
  bool accepting_allocations = 7;
  repeated Device capacity_devices = 8;
  repeated Device allocatable_devices = 9;
  // Data-plane address paired with this node process. API Server uses it to
  // seed ownership after a successful node-local create without a Coordinator readback.
  string relay_address = 10;
}
message NodeDirectory { uint64 epoch = 1; repeated NodeEndpoint nodes = 2; uint64 valid_for_millis = 3; }
message GetSchedulingQueueRequest {}
message PendingEnvironment { EnvironmentSpec spec = 1; uint64 enqueue_time_millis = 2; }
message GetSchedulingQueueResponse { repeated PendingEnvironment environments = 1; }
message SetNodeSchedulingRequest {
  string node_id = 1;
  bool accepting_allocations = 2;
  reserved 3;
}
message NodeSchedulingState { string node_id = 1; bool accepting_allocations = 2; }
message LocalEnvironmentCreateRequest {
  CreateEnvironmentRequest create = 1;
  string node_session_id = 2;
  // Explicit opt-in; ordinary local-first creation reserves only in memory.
  bool persist_claim = 3;
}
message PreparedEnvironment { EnvironmentSpec spec = 1; ReusableSnapshot snapshot = 2; }
message ClaimEnvironmentRequest {
  EnvironmentSpec spec = 1;
  CallerContext caller = 2;
  string node_session_id = 3;
  repeated DeviceAllocation devices = 4;
  string request_id = 5;
  uint64 create_deadline_unix_millis = 6;
  reserved 7;
  reserved "user_metadata";
}
message ClaimEnvironmentResponse {
  oneof outcome {
    StartAssignedEnvironmentRequest owned = 1;
    GetEnvironmentResponse existing = 2;
    bool fallback = 3; // Definitive no-write result; safe to release this attempt's hold.
  }
}

// Internal upgrade controls are deliberately separate from ordinary scheduling pause.
message NodeUpgradeGrant {
  string environment_id = 1;
  uint64 assignment_generation = 2;
  repeated string actions = 3;
}
message NodeUpgradeControl {
  string task_id = 1;
  uint64 epoch = 2;
  string node_session_id = 3;
  uint64 revision = 4;
  string phase = 5;
  repeated NodeUpgradeGrant grants = 6;
}
message NodeUpgradeInspectRequest {
  string task_id = 1;
  uint64 epoch = 2;
  string node_session_id = 3;
  string environment_id = 4;
}
message WakeNodeReconciliationRequest { string node_session_id = 1; }
message WakeNodeReconciliationResponse {}
message NodeUpgradeInspection {
  string task_id = 1;
  uint64 epoch = 2;
  string node_session_id = 3;
  uint64 revision = 4;
  string phase = 5;
  uint64 controllers = 6;
  uint64 holds = 7;
  uint64 backends = 8;
  uint64 authority_tasks = 9;
  bool unknown = 10;
  bool strict_empty = 11;
  bool may_have_executed = 12;
  repeated NodeUpgradeGrant grants = 13;
  EnvironmentResult environment = 14;
  // Byte identity of the immutable default local EROFS root; empty means unknown.
  string runtime_rootfs_sha256 = 15;
  string runtime_rootfs_path = 16;
  // Explicit maintenance protocol, including DeleteEnvironmentRequest field allocation.
  uint32 protocol_version = 17;
}
