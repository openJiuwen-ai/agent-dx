syntax = "proto3";

package adx.control.v1;

// Versioned internal Instance control. All callers authenticate with mTLS.
import public "instance_types.proto";
import public "snapshot.proto";
import public "credentials.proto";
import public "routes.proto";

service MasterService {
  rpc WatchNodes(WatchNodesRequest) returns (stream NodeDirectory);
  rpc PrepareCreate(LocalCreateRequest) returns (PreparedCreate);
  rpc ClaimInstance(ClaimInstanceRequest) returns (ClaimInstanceResponse);
  rpc ForwardCreate(LocalCreateRequest) returns (InstanceResult);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc InspectNode(InspectNodeRequest) returns (InspectNodeResponse);
  rpc CreateInstance(CreateInstanceRequest) returns (InstanceResult);
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  // Node-owned state decisions are persisted by Master. This does not transfer
  // ownership of the Instance lifecycle to Master.
  rpc CommitInstance(CommitInstanceRequest) returns (CommitInstanceResponse);
}

service NodeService {
  rpc CreateLocalInstance(LocalCreateRequest) returns (InstanceResult);
  rpc RecoverInstance(RecoverInstanceRequest) returns (InstanceResult);
  // Master verifies the process currently serving an already registered address
  // before accepting a pre-timeout process replacement. Available during reconciliation.
  rpc GetSession(GetNodeSessionRequest) returns (GetNodeSessionResponse);
  rpc CreateInstance(StartAssignedInstanceRequest) returns (InstanceResult);
  rpc DeleteInstance(DeleteInstanceRequest) returns (InstanceResult);
  rpc PauseInstance(PauseInstanceRequest) returns (InstanceResult);
  rpc ResumeInstance(ResumeInstanceRequest) returns (InstanceResult);
  rpc UpdateNetworkPolicy(UpdateNetworkPolicyRequest) returns (InstanceResult);
  rpc ReloadInstance(ReloadInstanceRequest) returns (InstanceResult);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc CollectSnapshot(CollectSnapshotRequest) returns (CollectSnapshotResponse);
}

message RecoverInstanceRequest { InstanceRecord record = 1; string node_session_id = 2; }

message GetNodeSessionRequest {}

message GetNodeSessionResponse { string node_id = 1; string session_id = 2; }

message RegisterNodeRequest {
  string node_id = 1;
  string node_address = 2;
  Resources capacity = 3;
  bool accepting_allocations = 4;
  map<string,string> labels = 5;
  repeated Device devices = 6;
  string proxy_address = 7;
  string session_id = 8; // Unique for one Node Manager process lifetime.
  uint64 heartbeat_sequence = 9;
  bool reconciling = 10;

}

message RegisterNodeResponse { uint32 shard_id = 1; uint64 master_epoch = 2; }

message CreateInstanceRequest {
  InstanceSpec spec = 1;
  CallerContext caller = 2;
  // Bounds only time waiting for a central scheduling assignment.
  uint64 schedule_timeout_seconds = 3;
  // Bounds the complete public create operation across local or central paths.
  uint64 create_timeout_seconds = 4;
}

message GetInstanceRequest { string instance_id = 1; CallerContext caller = 2; }

message GetInstanceResponse { InstanceRecord record = 1; string node_address = 2; string node_proxy_address = 3; }

message StartAssignedInstanceRequest {
  ReusableSnapshot snapshot = 4;
  InstanceSpec spec = 1;
  Assignment assignment = 2;
  string node_session_id = 3;
}

message DeleteInstanceRequest { Assignment assignment = 1; CallerContext caller = 2; }

message CommitInstanceRequest { InstanceRecord record = 1; string node_session_id = 2; }

message CommitInstanceResponse { InstanceRecord record = 1; }

message InspectNodeRequest { string node_id = 1; string session_id = 2; }

message InspectNodeResponse { repeated InstanceRecord records = 1; uint64 master_epoch = 2; repeated ReusableSnapshot snapshots = 3; repeated RestorePoint retained_checkpoints = 4; }

message PauseInstanceRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; uint64 ttl_seconds = 5; uint64 timeout_seconds = 6; }

message ResumeInstanceRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; }

message UpdateNetworkPolicyRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  // Absence clears the complete policy and restores unrestricted networking.
  NetworkPolicy network = 5;
}

message ReloadInstanceRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
}



// Node-local entry discovery. Every frame is a complete, bounded-lifetime view.
message WatchNodesRequest {}
message NodeEndpoint {
  string node_id = 1;
  string address = 2;
  string session_id = 3;
  Resources capacity = 4;
  Resources allocatable = 5;
  map<string,string> labels = 6;
}
message NodeDirectory { uint64 epoch = 1; repeated NodeEndpoint nodes = 2; uint64 valid_for_millis = 3; }
message LocalCreateRequest { CreateInstanceRequest create = 1; string node_session_id = 2; }
message PreparedCreate { InstanceSpec spec = 1; ReusableSnapshot snapshot = 2; }
message ClaimInstanceRequest { InstanceSpec spec = 1; CallerContext caller = 2; string node_session_id = 3; repeated DeviceAllocation devices = 4; }
message ClaimInstanceResponse {
  oneof outcome {
    StartAssignedInstanceRequest owned = 1;
    GetInstanceResponse existing = 2;
    bool fallback = 3; // Definitive no-write result; safe to release this attempt's hold.
  }
}
