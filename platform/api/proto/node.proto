syntax = "proto3";
package adx.node.v1;

service AdxletProcessService {
  rpc Begin(AdxletProcessRequest) returns (AdxletProcessState);
  rpc Query(AdxletProcessRequest) returns (AdxletProcessState);
}
message AdxletRuntimeInspectRequest {}
message AdxletRuntimeInspection {
  string node_id = 1;
  string node_session = 2;
  string relay_session = 3;
  string route_owner = 4;
  bool ready = 5;
}
message AdxletProcessRequest {
  string rollout_id = 1;
  string local_task_id = 2;
  uint64 epoch = 3;
  string old_node_session = 4;
  string old_relay_session = 5;
  uint64 deadline_unix_millis = 6;
}
message AdxletProcessState {
  AdxletProcessRequest identity = 1;
  string phase = 2;
  string node_session = 3;
}

// Standalone Relay only, on the existing protected route.sock listener.
service RelayUpgradeService {
  // Protected standalone UDS only. Exact ready predecessor; preserves live routes on controller takeover.
  rpc TakeoverBindings(BindingTakeoverRequest) returns (BindingState);
  // Idempotent acceptance survives caller cancellation; success certifies both listeners released.
  rpc BeginDrain(RelayUpgradeRequest) returns (RelayUpgradeState);
}
message BindingTakeoverRequest {
  BindingState expected = 1;
  string new_controller_session_id = 2;
  BindingSnapshot snapshot = 3;
}
message RelayUpgradeRequest { string task_id = 1; string proxy_session_id = 2; }
message RelayUpgradeState {
  string task_id = 1;
  string proxy_session_id = 2;
  // Set only after the business listener is dropped and health owner has exited.
  bool listeners_released = 4;
  // Fixed when release is confirmed; BeginDrain retries never extend it.
  uint64 drain_deadline_unix_ms = 5;
}

// Adxlet is the only writer. Shared-process deployments implement this
// contract directly; separate processes use a protected local gRPC endpoint.
service RelayService {
  rpc GetBindingState(GetBindingStateRequest) returns (BindingState);
  rpc BeginBindings(BindingState) returns (BindingState);
  rpc ReplaceBindings(BindingSnapshot) returns (BindingState);
  rpc UpdateBinding(UpdateBindingRequest) returns (UpdateBindingResponse);
  rpc GetEnvironmentActivity(GetEnvironmentActivityRequest) returns (EnvironmentActivityState);
  rpc WatchActivity(GetBindingStateRequest) returns (stream ProxyActivitySnapshot);
  rpc SetEnvironmentAdmission(EnvironmentAdmissionRequest) returns (EnvironmentAdmissionResponse);
}
message EnvironmentAdmissionRequest {
  string environment_id = 1; string runtime_id = 2; string proxy_session_id = 3;
  uint64 activity_revision = 4; bool close = 5;
  // Explicit draining closes admission even with active streams. Planned
  // migrations instead close only against an observed idle activity revision.
  // Existing streams stay connected; await zero activity before retirement.
  bool drain = 6;
  // Fence delayed close calls after reopen and after controller reconciliation.
  uint64 sync_epoch = 7; uint64 admission_revision = 8;
}
message EnvironmentAdmissionResponse { bool closed = 1; }
message GetEnvironmentActivityRequest { string environment_id = 1; string runtime_id = 2; }
message EnvironmentActivityState { string proxy_session_id = 1; uint64 activity_revision = 2; uint64 active_streams = 3; uint64 sync_epoch = 4; }
message RuntimeTarget {
  string runtime_id = 1;
  string ip = 2;
}
message Retired {}
message GetBindingStateRequest {}
message BindingState { string proxy_session_id = 1; uint64 sync_epoch = 2; bool ready = 3; string controller_session_id = 4; }
message BindingSnapshot { string proxy_session_id = 1; uint64 sync_epoch = 2; repeated UpdateBindingRequest bindings = 3; }
message UpdateBindingRequest {
  string proxy_session_id = 6;
  uint64 sync_epoch = 7;
  string environment_id = 1;
  // Ordered lexicographically by (ownership_generation, binding_revision).
  // The generation comes from the durable Environment assignment.
  uint64 ownership_generation = 2;
  uint64 binding_revision = 3;
  oneof binding {
    RuntimeTarget active = 4;
    Retired retired = 5;
    // Still owned, but temporarily unavailable. The identical target may
    // reactivate at this version; retirement and target conflicts stay fenced.
    // Version zero is reserved for an owned, never-started assignment.
    RuntimeTarget suspended = 8;
  }
}
// Success acknowledges the new version and retirement of any replaced execution.
// Renewing the same generation and target preserves streams and admission state.
// Identical retries succeed; older versions or conflicting payloads
// at the same version fail with FAILED_PRECONDITION, except availability changes
// between Active and Suspended for the identical target. Receiver restart requires
// authoritative reconciliation before it serves traffic.
message UpdateBindingResponse {
  uint64 ownership_generation = 1;
  uint64 binding_revision = 2;
}

service NodeActivityService {
  rpc ReportSnapshot(ActivitySnapshot) returns (ActivityAcknowledgement);
}
// A complete snapshot for a registered proxy session. An omitted Environment has
// zero active streams. The receiver validates the session and discards earlier
// sequences. This is observation only; Adxlet owns idle/lifecycle policy.
message ActivitySnapshot {
  string proxy_session_id = 1;
  uint64 sequence = 2;
  repeated EnvironmentActivity environments = 3;
}
message EnvironmentActivity {
  string environment_id = 1;
  uint64 active_streams = 2;
}
message ActivityAcknowledgement { uint64 accepted_sequence = 1; }

// Supervisor-only local endpoint, served on a protected UDS, never on Node TCP.
service NodeAdminService {
  rpc Drain(DrainRequest) returns (DrainResponse);
  rpc Inspect(AdxletRuntimeInspectRequest) returns (AdxletRuntimeInspection);
}
message DrainRequest {}
message DrainResponse { uint64 deleted_environments = 1; }

// Standalone Relay handoff only, on Adxlet's protected admin UDS; never Drain.
// Mutations require the launch-time parent supervisor's UDS peer PID.
service RelayHandoffService {
  rpc Reserve(RelayHandoffRequest) returns (RelayHandoffState);
  // Parent certifies no old BeginDrain was sent. Exact cancellation is replayable.
  rpc Cancel(RelayHandoffRequest) returns (RelayHandoffState);
  rpc Switch(RelaySwitchRequest) returns (RelayHandoffState);
  rpc Finish(RelayHandoffProof) returns (RelayHandoffState);
}
// Evidence is supplied only by the parent that owns and reaps the old Child.
message RelayHandoffProof {
  RelayHandoffRequest identity = 1;
  uint32 old_pid = 2;
  bool listeners_released = 4;
  bool old_exited = 5;
}
// Facts from the supervisor that owns and reaps both Children.
message RelaySwitchRequest {
  RelayHandoffProof proof = 1;
  RelayReplacement replacement = 2;
}
message RelayReplacement {
  uint32 failed_pid = 1;
  bool failed_exited = 2;
  string replacement_socket = 3;
}
message RelayHandoffRequest {
  string task_id = 1;
  string old_socket = 2;
  string old_proxy_session_id = 3;
  string old_controller_session_id = 4;
  uint64 old_sync_epoch = 5;
  string candidate_socket = 6;
  // Empty at Reserve; fixed from the owned candidate after ordinary startup.
  string candidate_proxy_session_id = 7;
}
message RelayHandoffState {
  RelayHandoffRequest identity = 1;
  // beginning, active_fenced, completed, cancelled.
  string phase = 2;
  uint64 candidate_sync_epoch = 3;
}

// Complete activity view, including zero counts and revisions for bursts between updates.
message ProxyActivitySnapshot { string proxy_session_id = 1; repeated ProxyActivity environments = 2; bool reset = 3; }
message ProxyActivity { string environment_id = 1; string runtime_id = 2; uint64 revision = 3; uint64 active_streams = 4; bool removed = 5; }
