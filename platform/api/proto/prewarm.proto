syntax = "proto3";
package adx.control.v1;
import "environment_types.proto";

// Version 1 strict JSON payloads use adx_core::prewarm::management domain types.
// This service does not accept public claim/bind requests or runtime handles.
service PrewarmService {
  rpc MutatePool(PrewarmMutationRequest) returns (PrewarmView);
  rpc GetPool(PrewarmQuery) returns (PrewarmView);
  rpc ListPools(PrewarmQuery) returns (PrewarmView);
  rpc GetOperation(PrewarmQuery) returns (PrewarmView);
  rpc ListArtifacts(PrewarmArtifactsQuery) returns (PrewarmView);
}
message PrewarmMutationRequest { CallerContext caller = 1; bytes mutation_json = 2; uint32 contract_version = 3; }
message PrewarmQuery { CallerContext caller = 1; string id = 2; }
message PrewarmView { bytes json = 1; uint64 revision = 2; }
message PrewarmArtifactsQuery { CallerContext caller = 1; string pool_id = 2; uint32 page_size = 3; string page_token = 4; string state = 5; }

service PreparationNodeService {
  rpc Artifact(ArtifactRequest) returns (ArtifactResponse);
}
message ArtifactRequest { string node_session_id = 1; bytes command_json = 2; }
message ArtifactResponse { bytes observation_json = 1; }

message PreparationContext {
  string tenant = 1;
  string template = 2;
  string version = 3;
  string template_digest = 4;
  uint32 contract_version = 5;
  // Only "prefer" is supported; no pool/slot/node ID is caller selectable.
  string preference = 6;
}
