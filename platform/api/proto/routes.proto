syntax = "proto3";

package adx.control.v1;

import "instance_types.proto";

service RouteService { rpc WatchRoutes(WatchRoutesRequest) returns (stream RouteFrame); }

service InstanceDirectoryService {
  rpc WatchInstances(WatchInstancesRequest) returns (stream InstanceDirectoryFrame);
}

message WatchRoutesRequest {}

message PublishedRoute {
 string instance_id = 1;
 string tenant_id = 2;
 string runtime_id = 3;
 string runtime_ip = 4;
 string node_proxy_address = 5;
 uint64 generation = 6;
 uint64 instance_revision = 7;
 DataPlaneSecurityMode tunnel_security_mode = 8;
 DataPlaneSecurityMode port_forward_security_mode = 9;
 repeated uint32 forwarded_ports = 10;
}

message RouteFrame {
 uint64 epoch = 1;
 uint64 revision = 2;
 uint64 base_revision = 3;
 bool reset = 4;
 repeated PublishedRoute upserts = 5;
 repeated string deleted = 6;
}

message WatchInstancesRequest {}

message PublishedInstance {
  InstanceRecord record = 1;
  string node_address = 2;
  string node_proxy_address = 3;
}

message InstanceDirectoryFrame {
  uint64 epoch = 1;
  uint64 revision = 2;
  uint64 base_revision = 3;
  bool reset = 4;
  repeated PublishedInstance upserts = 5;
  repeated string deleted = 6;
}
