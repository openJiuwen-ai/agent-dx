syntax = "proto3";
package adx.runtime.v1;

// Execd initiates one node-local stream after its listeners/control state are ready.
// Reconnect starts with a full status. The node admits only expected execution
// identities; a new stream fences the previous stream for that exact identity.
service RuntimeControlService {
  rpc OpenControl(stream RuntimeEvent) returns (stream RuntimeCommand);
}
message RuntimeHello { string token = 1; bytes status_json = 2; }
message RuntimeReply {
  uint64 request_id = 1;
  bytes status_json = 2;
  // Stable adx-core category: INVALID, CONFLICT, UNAVAILABLE; empty on success.
  string error_code = 3;
  string error_message = 4;
}
message RuntimeEvent {
  oneof event {
    RuntimeHello hello = 1;
    bytes status_json = 2;
    RuntimeReply reply = 3;
  }
}
message RuntimeCommand {
  uint64 request_id = 1;
  // Bounded adx_protocol::runtime_stream::ControlOperation JSON. Reuses the
  // runtime types also served by HTTP; does not introduce another state machine.
  bytes operation_json = 2;
}
