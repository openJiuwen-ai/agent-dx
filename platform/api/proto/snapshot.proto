syntax = "proto3";

package adx.control.v1;

import "environment_types.proto";

service SnapshotService {
  rpc PublishSnapshot(PublishSnapshotRequest) returns (ReusableSnapshot);
  rpc GetSnapshot(GetSnapshotRequest) returns (ReusableSnapshot);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc UpdateSnapshotReference(UpdateSnapshotReferenceRequest) returns (ReusableSnapshot);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (ReusableSnapshot);
}

enum SnapshotKind {
  SNAPSHOT_KIND_REGULAR = 0;
  SNAPSHOT_KIND_GOLDEN = 1;
}

enum SnapshotState {
  SNAPSHOT_STATE_UNSPECIFIED = 0;
  SNAPSHOT_STATE_READY = 1;
  SNAPSHOT_STATE_DELETING = 2;
  SNAPSHOT_STATE_DELETED = 3;
}

message SnapshotReference {
  oneof owner {
    string restore_environment_id = 1;
    TemplateReference template = 2;
    AgentTemplateReference agent_template = 3;
    AgentBindingReference agent_binding = 4;
  }
}

message AgentTemplateReference { string name = 1; string version = 2; }
message AgentBindingReference { string binding_id = 1; string environment_id = 2; }

message ReusableSnapshot {
  bool agent_retiring = 12;
  uint64 agent_admission_revision = 13;
  string id = 1;
  repeated string names = 2;
  EnvironmentSpec template = 3;
  string source_node_id = 4;
  string source_runtime_id = 5;
  CheckpointArtifact artifact = 6;
  uint64 revision = 7;
  SnapshotState state = 8;
  repeated SnapshotReference references = 9;
  SnapshotKind kind = 10;
  uint64 created_at_unix_ms = 11;
}

message PublishSnapshotRequest { ReusableSnapshot snapshot = 1; string node_session_id = 2; }

message GetSnapshotRequest { string id = 1; CallerContext caller = 2; string node_session_id = 3; }

message ListSnapshotsRequest {
  CallerContext caller = 1;
  string name = 2;
  string page_token = 3;
  uint32 page_size = 4;
  optional SnapshotKind kind = 5;
  // Empty selects the whole tenant catalog; otherwise only snapshots captured
  // from this source Environment are returned.
  string environment_id = 6;
}

message ListSnapshotsResponse { repeated ReusableSnapshot snapshots = 1; string next_page_token = 2; }

message UpdateSnapshotReferenceRequest {
  optional uint64 expected_revision = 7;
  string id = 1;
  CallerContext caller = 2;
  oneof change {
    SnapshotReference acquire = 3;
    SnapshotReference release = 4;
    bool retire_agent_recipe = 5;
    SnapshotReference cancel_pending = 6;
  }
}

message DeleteSnapshotRequest {
  string id = 1;
  CallerContext caller = 2;
  reserved 3;
}

message CollectSnapshotRequest { ReusableSnapshot snapshot = 1; string node_session_id = 2; bool delegated = 3; }

message CollectSnapshotResponse { string snapshot_id = 1; uint64 revision = 2; }

message CreateSnapshotRequest {
  Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3;
  uint64 expected_revision = 4; repeated string names = 5; uint64 timeout_seconds = 6; SnapshotKind kind = 7;
  // Required for Coordinator-originated capture; binds the owner process session.
  string node_session_id = 8;
}

message CreateSnapshotResponse { ReusableSnapshot snapshot = 1; EnvironmentResult environment = 2; }

message TemplateReference { string node_id = 1; string template_id = 2; }
