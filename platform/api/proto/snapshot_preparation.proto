syntax = "proto3";
package adx.control.v1;

import "environment_types.proto";

enum SnapshotPreparationPhase {
  SNAPSHOT_PREPARATION_PHASE_UNSPECIFIED = 0;
  SNAPSHOT_PREPARATION_PHASE_REGISTERED = 1;
  SNAPSHOT_PREPARATION_PHASE_CREATING = 2;
  SNAPSHOT_PREPARATION_PHASE_SNAPSHOTTING = 3;
  SNAPSHOT_PREPARATION_PHASE_CLEANING = 4;
  SNAPSHOT_PREPARATION_PHASE_READY = 5;
  SNAPSHOT_PREPARATION_PHASE_FAILED = 6;
  SNAPSHOT_PREPARATION_PHASE_PREPARING = 7;
}

// Public platform preparation operations. Protocol adapters only project these records.
service SnapshotPreparationService {
  rpc RegisterSnapshotPreparation(RegisterSnapshotPreparationRequest) returns (SnapshotPreparationView);
  rpc StartSnapshotPreparation(StartSnapshotPreparationRequest) returns (SnapshotPreparationView);
  rpc GetSnapshotPreparation(GetSnapshotPreparationRequest) returns (SnapshotPreparationView);
  rpc ResolveSnapshotTemplate(ResolveSnapshotTemplateRequest) returns (SnapshotPreparationView);
  rpc DeleteSnapshotTemplate(DeleteSnapshotTemplateRequest) returns (DeleteSnapshotTemplateResponse);
}

message RegisterSnapshotPreparationRequest {
  CallerContext caller = 1;
  string name = 2;
  Resources resources = 4;
}
message StartSnapshotPreparationRequest {
  CallerContext caller = 1;
  string template_id = 2;
  string preparation_id = 3;
  EnvironmentSpec spec = 4;
  PreparationPlan plan = 5;
}

// One concrete source-instance recipe; never captured in EnvironmentSpec.
message PreparationPlan {
  repeated PreparationStep steps = 1;
  optional string start_command = 2;
  optional string ready_command = 3;
  uint64 timeout_seconds = 4;
}
message PreparationFile {
  string scope = 1;
  string location = 2;
  uint64 size_bytes = 3;
  string sha256 = 4;
}
message PreparationCopy {
  PreparationFile file = 1;
  string source = 2;
  string destination = 3;
  optional string user = 4;
  optional uint32 mode = 5;
}
message PreparationRun { string command = 1; optional string user = 2; }
message PreparationEnvironment { map<string,string> values = 1; }
message PreparationStep {
  oneof operation {
    PreparationCopy copy = 1;
    PreparationRun run = 2;
    PreparationEnvironment environment = 3;
    string user = 4;
    string workdir = 5;
  }
}

enum SourcePreparationStatus {
  SOURCE_PREPARATION_STATUS_UNSPECIFIED = 0;
  SOURCE_PREPARATION_STATUS_RUNNING = 1;
  SOURCE_PREPARATION_STATUS_SUCCEEDED = 2;
  SOURCE_PREPARATION_STATUS_FAILED = 3;
  SOURCE_PREPARATION_STATUS_UNKNOWN = 4;
}
message PreparationLogEntry {
  uint64 offset = 1;
  uint64 timestamp_unix_ms = 2;
  string level = 3;
  string message = 4;
}
message SourcePreparationResult {
  string operation_id = 1;
  string plan_sha256 = 2;
  SourcePreparationStatus status = 3;
  uint32 step_index = 4;
  string error = 5;
  repeated PreparationLogEntry logs = 6;
  uint64 next_offset = 7;
  bool logs_truncated = 8;
}
message GetSnapshotPreparationRequest {
  CallerContext caller = 1;
  string template_id = 2;
  string preparation_id = 3;
}
message ResolveSnapshotTemplateRequest {
  CallerContext caller = 1;
  // Family ID or name only; selector syntax belongs to protocol adapters.
  string reference = 2;
  // Return the current registration without requiring a completed native snapshot.
  bool registration_only = 3;
}
message DeleteSnapshotTemplateRequest {
  CallerContext caller = 1;
  string template_id = 2;
  bool require_unused = 3;
}
message DeleteSnapshotTemplateResponse {}

// Deliberately omits credentials, execution environment and private artifact locations.
message SnapshotPreparationView {
  reserved 6, 14;
  reserved "state", "build_status";
  string template_id = 1;
  string name = 2;
  string preparation_id = 3;
  Resources resources = 5;
  string snapshot_id = 7;
  string error = 8;
  // Family creation time; preparation timestamps are separate below.
  uint64 created_at_unix_ms = 9;
  string image = 10;
  string envd_version = 11;
  SnapshotPreparationPhase phase = 15;
  bool snapshot_available = 17;
  // Zero timestamps and absent spawn_count denote unknown historical metadata.
  uint64 template_updated_at_unix_ms = 18;
  uint64 preparation_created_at_unix_ms = 19;
  uint64 preparation_updated_at_unix_ms = 20;
  optional uint64 last_spawned_at_unix_ms = 21;
  optional uint64 spawn_count = 22;
  SourcePreparationResult source_preparation = 23;
}
