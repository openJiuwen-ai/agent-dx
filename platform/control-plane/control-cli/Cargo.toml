[package]
name = "adx-control-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADX deployment CLI and process supervisor"
[lints]
workspace = true

[[bin]]
name = "adxctl"
path = "src/main.rs"
[dependencies]
adx-core = { path = "../../crates/core" }
flate2 = "1"
adx-protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util"] }
tonic = "0.12"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
