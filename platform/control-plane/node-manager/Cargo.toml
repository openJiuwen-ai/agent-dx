[package]
name = "adx-node-manager"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
uuid = { version = "1", features = ["v4"] }
adx-discovery = { path = "../../crates/discovery" }
serde = { version = "1", features = ["derive"] }
tokio-stream = { version = "0.1", features = ["net"] }
adx-core = { path = "../../crates/core" }
adx-protocol = { path = "../../crates/protocol" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tonic = "0.12"
prost = "0.13"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
data-plane-gateway = { path = "../../../gateway" }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
