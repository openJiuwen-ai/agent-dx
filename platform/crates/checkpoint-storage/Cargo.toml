[package]
name = "adx-checkpoint-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
adx-core = { path = "../core" }
adx-observability = { path = "../../../crates/observability" }
adx-transport = { path = "../../../crates/transport" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "sync", "fs", "io-util", "time"] }
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
futures-util = "0.3"
sha2 = "0.10"
[dev-dependencies]
tempfile = "3"
[lints]
workspace = true
