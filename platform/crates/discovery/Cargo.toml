[package]
name = "adx-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Redis-backed ADX component registration and discovery"
[lints]
workspace = true

[dependencies]
adx-core = { path = "../core" }
adx-observability = { path = "../../../crates/observability" }
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "test-util"] }
