[package]
name = "adx-protocol"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["signal", "macros"] }
adx-core = { path = "../core" }
prost = "0.13"
tonic = { version = "0.12", features = ["tls"] }
sha2 = "0.10"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
