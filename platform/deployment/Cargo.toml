[package]
name = "adx-deployment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified ADX control-plane and data-plane deployment"
[lints]
workspace = true

[[bin]]
name = "adxctl"
path = "src/main.rs"

[[bin]]
name = "adx-inspect"
path = "src/inspect.rs"
[dependencies]
adx-core = { path = "../crates/core" }
adx-observability = { path = "../../crates/observability" }
clap = { version = "4", features = ["derive", "env"] }
adx-protocol = { path = "../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize", "serialize"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util"] }
tonic = "0.12"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
[dev-dependencies]
flate2 = "1"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
