[package]
name = "adx-deployment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified ADX control-plane and data-plane deployment"
[lints]
workspace = true

[[bin]]
name = "adxctl"
path = "src/main.rs"

[[bin]]
name = "adx-inspect"
path = "src/inspect.rs"
[dependencies]
adx-core = { path = "../crates/core" }
adx-process = { path = "../../crates/process" }
adx-observability = { path = "../../crates/observability" }
clap = { version = "4", features = ["derive", "env"] }
adx-protocol = { path = "../crates/protocol" }
adx-transport = { path = "../../crates/transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize", "serialize"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util"] }
tonic = "0.12"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
httpdate = "1"
[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
