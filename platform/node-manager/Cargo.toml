[package]
name = "adx-node-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADX node-local instance lifecycle and runtime coordination"
build = "build.rs"

[lints]
workspace = true

[dependencies]
adx-observability = { path = "../../crates/observability" }
adx-transport = { path = "../../crates/transport" }
data-plane-gateway = { path = "../../gateway" }
uuid = { version = "1", features = ["v4"] }
adx-discovery = { path = "../crates/discovery" }
serde = { version = "1", features = ["derive"] }
tokio-stream = { version = "0.1", features = ["net"] }
adx-core = { path = "../crates/core" }
adx-protocol = { path = "../crates/protocol" }
adx-process = { path = "../../crates/process" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tonic = "0.12"
prost = "0.13"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
# Use the same Ring provider as the control-plane TLS stack.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
futures-util = "0.3"
sha2 = "0.10"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
