[package]
name = "rrt-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADX runtime request transport and in-instance runtime daemon"

[lints]
workspace = true

[lib]
name = "rrt_daemon"
path = "src/lib.rs"

[[bin]]
name = "rrt-runtime"
path = "src/bin/rrt-runtime.rs"

[dependencies]
adx-observability = { path = "../../crates/observability" }
adx-core = { path = "../../crates/core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde-pickle = "1"
rmp-serde = "1"
rmpv = "1"
rmp = "0.8"
portable-pty = "0.8"
libc = "0.2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"

[dev-dependencies]
adx-node-manager = { path = "../../node-manager" }
