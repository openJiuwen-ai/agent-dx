[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dx-sdk"
dynamic = ["version"]
description = "Python SDK and FaaS bootstrap for Agent Distributed Executor (agent-dx)"
readme = "README.md"
requires-python = ">=3.9"
# Keep the legacy table form for build environments using setuptools < 77.
license = {text = "Apache-2.0"}
authors = [{name = "openyuanrong"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
