[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "adxadmin"
version = "0.1.0"
description = "Remote administration client for Agent DX"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.24,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://gitcode.com/openJiuwen/agent-dx"
Documentation = "https://gitcode.com/openJiuwen/agent-dx/blob/refactor/docs/deployment/adxadmin.md"

[project.scripts]
adxadmin = "adxadmin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adxadmin = ["py.typed"]
